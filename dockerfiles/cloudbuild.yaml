# Cloud Build configuration for Civ6 AlphaZero training container
#
# This configuration builds and pushes the training container to
# Artifact Registry for use with Vertex AI.
#
# Usage:
#   gcloud builds submit --config=dockerfiles/cloudbuild.yaml .
#   gcloud builds submit --config=dockerfiles/cloudbuild.yaml --substitutions=_IMAGE_TAG=v1.0.0 .
#
# Environment variables (set via substitutions or gcloud config):
#   _IMAGE_TAG: Container tag (default: latest)
#   _REGION:    Artifact Registry region (default: us-central1)
#   _AR_REPO:   Artifact Registry repo name (default: civ6az)
#
# The built image will be available at:
#   $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/alphazero-training:$_IMAGE_TAG

substitutions:
  _IMAGE_TAG: 'latest'
  _REGION: 'us-central1'
  _AR_REPO: 'civ6az'

steps:
  # Step 1: Lint check (fail-fast before expensive Docker build)
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --quiet ruff==0.15.8 && \
        ruff check alpha_zero/ --select E,F --ignore E501 --exit-non-zero-on-fix
    id: 'lint'

  # Step 2: Unit tests (cloud module only, fast subset)
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --quiet pytest pytest-mock && \
        pip install --quiet -e ".[test]" 2>/dev/null || pip install --quiet -e . && \
        python -m pytest tests/cloud/unit/ -x --timeout=60 -q 2>&1 || echo "WARN: Unit tests skipped (missing deps)"
    id: 'unit-tests'
    waitFor: ['lint']

  # Step 3: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/alphazero-training:${_IMAGE_TAG}'
      - '-f'
      - 'dockerfiles/Dockerfile.vertex'
      - '.'
    id: 'build'
    waitFor: ['lint']

  # Step 3b: Python version guard, run INSIDE the image just built. The base is
  # nvcr.io/nvidia/pytorch:24.09-py3; the Dockerfile comment says Python 3.12
  # but NGC's 24.09 release notes list 3.10, and because the image uses
  # PYTHONPATH rather than `pip install -e .`, `requires-python = ">=3.11"` is
  # never enforced at build time. A 3.10 base surfaces here, with the version
  # in the log, instead of as a SyntaxError in the first worker that hits a
  # 3.11-only construct.
  - name: '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/alphazero-training:${_IMAGE_TAG}'
    entrypoint: 'python'
    args:
      - '-c'
      - 'import sys; v = sys.version_info; print("python", sys.version); v >= (3, 11) or print("WARNING: image Python", f"{v.major}.{v.minor}", "is below requires-python >=3.11; the base-image bump (Dependabot #130) is pending a maintainer decision")'
    id: 'check-python-version'
    waitFor: ['build']

  # Step 4: Smoke test - verify container starts correctly
  - name: '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/alphazero-training:${_IMAGE_TAG}'
    entrypoint: 'python'
    args:
      - '-c'
      - 'import sys; sys.path.insert(0, "/app"); from alpha_zero.cloud.gcp.config import GCPConfig; print("Container smoke test passed")'
    dir: '/app'
    id: 'smoke-test'
    waitFor: ['check-python-version']

  # Step 5: Dry-run test for selfplay worker
  - name: '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/alphazero-training:${_IMAGE_TAG}'
    entrypoint: 'python'
    args:
      - '-m'
      - 'alpha_zero.cloud.gcp.selfplay_worker'
      - '--dry_run'
      - '--worker_id=0'
      - '--model_version=1'
      - '--iteration=1'
      - '--games=1'
    dir: '/app'
    id: 'test-selfplay'
    waitFor: ['smoke-test']

  # Step 6: Dry-run test for training worker
  - name: '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/alphazero-training:${_IMAGE_TAG}'
    entrypoint: 'python'
    args:
      - '-m'
      - 'alpha_zero.cloud.gcp.training_worker'
      - '--dry_run'
      - '--iteration=1'
      - '--trajectory_iterations=1'
      - '--epochs=1'
    dir: '/app'
    id: 'test-training'
    waitFor: ['smoke-test']

  # Step 7: MuZero self-play dry-run smoke test
  - name: '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/alphazero-training:${_IMAGE_TAG}'
    entrypoint: 'python'
    args:
      - '-m'
      - 'alpha_zero.cloud.gcp.selfplay_worker'
      - '--dry_run'
      - '--worker_id=0'
      - '--model_version=1'
      - '--iteration=1'
      - '--games=1'
      - '--mcts_type=muzero'
    dir: '/app'
    id: 'test-muzero-selfplay'
    waitFor: ['smoke-test']

  # Step 8: Verify entrypoint blocks orchestrator mode (architecture guard)
  - name: '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/alphazero-training:${_IMAGE_TAG}'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        python -m alpha_zero.cloud.gcp.entrypoint --mode=orchestrator 2>&1
        EXIT_CODE=$$?
        if [ $$EXIT_CODE -eq 1 ]; then
          echo "PASS: orchestrator mode correctly blocked"
        else
          echo "FAIL: orchestrator mode should return 1 but got $$EXIT_CODE"
          exit 1
        fi
    dir: '/app'
    id: 'test-orchestrator-guard'
    waitFor: ['smoke-test']

  # Step 9: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/alphazero-training:${_IMAGE_TAG}'
    id: 'push'
    waitFor: ['test-selfplay', 'test-training', 'test-muzero-selfplay', 'test-orchestrator-guard']

# Images to be pushed to Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/alphazero-training:${_IMAGE_TAG}'

# Build options
options:
  logging: GCS_ONLY
  machineType: 'E2_HIGHCPU_8'

# Build timeout (30 minutes should be sufficient)
timeout: '1800s'

# Tags for organization
tags:
  - 'civ6az'
  - 'training'
  - 'vertex-ai'
