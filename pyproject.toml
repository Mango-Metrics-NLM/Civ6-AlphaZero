[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha_zero"
version = "1.3.0"
description = "AlphaZero-based AI for Civilization VI"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.23.0",
    "gymnasium>=0.29.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.2.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "tqdm>=4.65.0",
    "types-tqdm>=4.65.0",
    "bandit>=1.7.0",
    "types-PyYAML>=6.0.0",
    "psutil>=5.9.0",
    "httpx>=0.25.0",
]
gcp = [
    "google-cloud-aiplatform>=1.40.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-logging>=3.5.0",
    "google-auth>=2.25.0",
    "grpcio>=1.50.0",
]
distributed = [
    "grpcio>=1.50.0",
    "grpcio-tools>=1.50.0",
]

llm = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]
web = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
]
spacetimedb = [
    "spacetimedb-sdk>=0.7.0",
]
all = [
    "alpha_zero[dev]",
    "alpha_zero[gcp]",
    "alpha_zero[distributed]",
    "alpha_zero[llm]",
    "alpha_zero[web]",
    "alpha_zero[spacetimedb]",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "N", "ANN", "S", "RUF"]
ignore = [
    "E501",    # Line length handled separately
    "ANN401",  # Any type allowed for duck typing with cloud SDKs
    "S101",    # Use of assert (needed for tests)
    "UP038",   # isinstance(x, (A, B)) is faster than isinstance(x, A | B) — deprecated in ruff 0.9+
    "UP042",   # Prefer StrEnum over (str, Enum) — deferred refactor
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "N803", "S108", "S603", "S607", "S310", "N806", "N812", "RUF012", "S110", "S104", "B017", "RUF003"]
"**/tests/*" = ["S101", "ANN", "N803", "S108", "S603", "S607", "S310", "N806", "N812", "RUF012", "S110", "S104", "B017", "RUF003"]
"scripts/*" = ["ANN", "S603", "S607", "S310", "S105", "E741"]  # Scripts use subprocess, URL calls, and short var names
"alpha_zero/cloud/gcp/container_validator.py" = ["S603"]  # Internal subprocess call with validated input
"alpha_zero/cloud/preemption.py" = ["S310"]  # GCE metadata URL is intentional
"run_*.py" = ["ANN"]  # Skip annotations in run scripts
"alpha_zero/utils/reward_shaping.py" = ["RUF002"]  # Greek math symbols (γ, Φ) in formulas
"alpha_zero/mechanics/__init__.py" = ["E402"]  # Imports after deprecation warning
"alpha_zero/human_interface/__init__.py" = ["E402"]  # Imports after deprecation warning
"alpha_zero/integration/__init__.py" = ["E402"]  # Imports after deprecation warning

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tqdm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.cloud.*", "google.api.*", "grpc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alpha_zero.cloud.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "alpha_zero.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "alpha_zero.training.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "alpha_zero.tournament.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "alpha_zero.pbt.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "alpha_zero.web.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["fastapi.*", "uvicorn.*", "starlette.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "spacetimedb_sdk.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pyright]
pythonVersion = "3.11"
reportMissingTypeStubs = false
reportMissingModuleSource = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --timeout=120"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "requires_env: marks tests requiring specific environment setup",
    "security: marks security sanity tests",
    "sanity: marks import and basic sanity tests",
    "cloud: marks cloud integration tests",
    "requires_gcp: marks tests requiring GCP credentials",
    "requires_vertex_ai: marks tests requiring Vertex AI access",
    "requires_multi_gpu: marks tests requiring multiple GPUs",
    "requires_distributed: marks tests requiring distributed training setup",
    "requires_cloud_env: marks tests requiring full cloud environment",
    "e2e: marks tests as end-to-end tests",
    "benchmark: marks tests as benchmarks (deselect with '-m \"not benchmark\"')",
    "web: marks web interface tests",
    "smoke: marks smoke tests for quick validation (select with '-m smoke')",
    "requires_spacetimedb: marks tests requiring running SpacetimeDB instance",
]

[tool.coverage.run]
source = ["alpha_zero"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
fail_under = 80
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
