[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha_zero"
version = "2.0.0"
description = "AlphaZero/MuZero-style self-play reinforcement learning for a Civilization-like environment, with a bridge into Civilization VI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ian Cruickshank" }]
maintainers = [{ name = "Ian Cruickshank" }]
keywords = ["alphazero", "muzero", "mcts", "reinforcement-learning", "self-play", "civilization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.23.0",
    "gymnasium>=0.29.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.urls]
Homepage = "https://github.com/Mango-Metrics-NLM/Civ6-AlphaZero"
Repository = "https://github.com/Mango-Metrics-NLM/Civ6-AlphaZero"
Issues = "https://github.com/Mango-Metrics-NLM/Civ6-AlphaZero/issues"
Changelog = "https://github.com/Mango-Metrics-NLM/Civ6-AlphaZero/blob/HEAD/CHANGELOG.md"
Documentation = "https://github.com/Mango-Metrics-NLM/Civ6-AlphaZero/blob/HEAD/docs/README.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.2.0",
    "mypy==1.19.1",
    "ruff==0.15.8",
    "tqdm>=4.65.0",
    "types-tqdm>=4.65.0",
    "bandit>=1.7.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
    "psutil>=5.9.0",
    "httpx>=0.25.0",
    # Test-only dependencies (previously missing; caused 8 test files to fail collection).
    # `chess` is deliberately NOT here: its sdist fails to build on Debian/Ubuntu
    # setuptools (AttributeError: install_layout), and because a failing extra
    # aborts the whole install, `pip install -e '.[dev]'` -- the command in
    # README, CONTRIBUTING and CLAUDE.md - installed NOTHING. The chess tests
    # `pytest.importorskip("chess")` and the `[chess]` extra still provides it.
    "hypothesis>=6.0.0",
    # Mirrors the `hub` extra. Kept in `dev` so CI actually exercises and measures
    # the Hugging Face round-trip; without it the test importorskips away and
    # alpha_zero/hexcrystal/hub_mixin.py reports as uncovered.
    "huggingface_hub>=0.26,<1.0",
    "safetensors>=0.4",
]
gcp = [
    "google-cloud-aiplatform>=1.40.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-logging>=3.5.0",
    "google-auth>=2.25.0",
    "grpcio>=1.50.0",
]
distributed = [
    "grpcio>=1.50.0",
    "grpcio-tools>=1.50.0",
]

llm = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]
web = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
]
# MLflow experiment tracking. Optional; the orchestrator gracefully degrades
# when mlflow is not installed. Upper bound: mlflow 3.x reshuffles MlflowClient
# APIs and is in active dev — pin to 2.x for now.
monitoring = [
    "mlflow>=2.12.0,<3.0",
]
spacetimedb = [
    "spacetimedb-sdk>=0.7.0",
]
tuning = [
    "optuna>=3.0.0",
]
jax = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "equinox>=0.11.0",
    "optax>=0.2.0",
]
chess = [
    "chess>=1.11.0",
]
# Hugging Face Hub integration. Opt-in; the hexcrystal encoder and other models
# use PyTorchModelHubMixin for save_pretrained / from_pretrained support.
hub = [
    "huggingface_hub>=0.26,<1.0",
    "safetensors>=0.4",
]
# Dataset export to Hugging Face Hub.
datasets = [
    "datasets>=2.18.0",
]
# Gradio Spaces for interactive demos.
spaces = [
    "gradio>=4.20.0",
]
# LLM evaluation harness (github.com/ianshank/Agents -> dist "langfuse-eval-harness").
# Optional; the eval gate (scripts/run_llm_eval.py / `make eval-llm`) degrades
# gracefully when this is not installed. Pinned to a commit SHA so the grader the
# gate depends on stays reproducible rather than tracking a moving branch.
eval = [
    "langfuse-eval-harness @ git+https://github.com/ianshank/Agents@2cbdbc674d5b533957ca9259ed58c26bd2d8d49b",
]
# `eval` is deliberately absent: it is a direct git-URL dependency, which an index
# upload rejects; install it explicitly with `.[eval]`.
all = [
    "alpha_zero[dev]",
    "alpha_zero[gcp]",
    "alpha_zero[distributed]",
    "alpha_zero[llm]",
    "alpha_zero[web]",
    "alpha_zero[spacetimedb]",
    "alpha_zero[tuning]",
    "alpha_zero[jax]",
    "alpha_zero[chess]",
    "alpha_zero[monitoring]",
    "alpha_zero[hub]",
    "alpha_zero[datasets]",
    "alpha_zero[spaces]",
]


# Explicit package discovery so editable installs (pip install -e .) deterministically
# register every alpha_zero submodule. Without this, setuptools auto-discovery has
# to guess against the many top-level dirs in this repo, and the resulting custom
# MetaPathFinder can fail to resolve submodules when imported through long
# transitive chains (e.g. `python scripts/run_chess_training.py` triggering
# `from alpha_zero.utils.checkpoint import ...` via env_factory -> microciv -> core).
[tool.setuptools.package-data]
alpha_zero = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["alpha_zero*"]
exclude = [
    "tests*",
    "scripts*",
    "infra*",
    "configs*",
    "data*",
    "docs*",
    "dockerfiles*",
    "kb*",
    "examples*",
    "checkpoints*",
    "logs*",
    "replays*",
    "mod*",
    "k8s*",
    "experimental*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Unmaintained fringe (examples, experimental server modules) is outside the
# lint/format gate; the maintained set is everything else. (experimental/ and spaces/
# force-exclude makes pre-commit (which passes explicit filenames) honour this too.
# The "./" prefix anchors each pattern to the repo root — a bare name would also
# match nested dirs (e.g. alpha_zero/examples/) and silently de-gate them.
extend-exclude = [
    "./examples",
    "./experimental",
]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "N", "ANN", "S", "RUF", "PLR0915"]
ignore = [
    "E501",    # Line length handled separately
    "ANN401",  # Any type allowed for duck typing with cloud SDKs
    "S101",    # Use of assert (needed for tests)
    "UP042",   # Prefer StrEnum over (str, Enum) — deferred refactor
]

[tool.ruff.lint.pylint]
# Statements per function, not lines per module. The pathology this repo actually has
# is the 600-line `main`, and module line count is only a proxy for it. 100 is set just
# above the largest function that is not already on the burndown list, so the rule
# ratchets: it blocks new growth without demanding an immediate rewrite.
max-statements = 100

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "N803", "S108", "S603", "S607", "S310", "N806", "N812", "RUF012", "S110", "S104", "B017", "RUF003"]
"**/tests/*" = ["S101", "ANN", "N803", "S108", "S603", "S607", "S310", "N806", "N812", "RUF012", "S110", "S104", "B017", "RUF003"]
"tests/unit/test_hexcrystal_hub_mixin.py" = ["E402"]  # pytest.importorskip guards precede imports
"tests/unit/test_chess_*.py" = ["E402"]  # pytest.importorskip guards precede imports
"tests/unit/test_stockfish_opponent.py" = ["E402"]  # same
"tests/unit/test_opponent_protocol.py" = ["E402"]  # same
"tests/unit/test_curriculum.py" = ["E402"]  # same
"tests/integration/test_chess_*.py" = ["E402"]  # pytest.importorskip guards precede imports
"scripts/*" = ["ANN", "S603", "S607", "S310", "S105", "E741"]  # Scripts use subprocess, URL calls, and short var names
# PLR0915 burndown (max-statements = 100). Three `main` functions exceed it, at 248,
# 168 and 134 statements; all are known decomposition targets, deferred with the rest
# of the cloud-worker work. Delete an entry -- do not raise the threshold -- when its
# function is split.
"alpha_zero/cloud/gcp/vertex_orchestrator.py" = ["PLR0915"]  # main(): 248 statements
"alpha_zero/cloud/gcp/training_worker.py" = ["PLR0915"]  # main(): 168 statements
"scripts/run_enhanced_training.py" = ["PLR0915"]  # main(): 134 statements
"alpha_zero/cloud/gcp/container_validator.py" = ["S603"]  # Internal subprocess call with validated input
"alpha_zero/cloud/gcp/preemption.py" = ["S310"]  # GCP preemption handler metadata URL is intentional
"scripts/run_*.py" = ["ANN"]  # Skip annotations in run scripts
"scripts/run_civ6_ai.py" = ["S603"]  # Launcher wrapper: subprocess runs a fixed python -m module
"alpha_zero/utils/reward_shaping.py" = ["RUF002"]  # Greek math symbols (γ, Φ) in formulas
"alpha_zero/mechanics/__init__.py" = ["E402"]  # Imports after deprecation warning
"alpha_zero/human_interface/__init__.py" = ["E402"]  # Imports after deprecation warning
"alpha_zero/integration/__init__.py" = ["E402"]  # Imports after deprecation warning
"scripts/validate_convergence.py" = ["E402"]  # sys.path bootstrap before alpha_zero imports
"scripts/benchmark_batch_selfplay.py" = ["E402"]  # sys.path bootstrap before alpha_zero imports
"scripts/analyze_prod_v1.6.0.py" = ["N999"]  # Versioned script filename is intentional
"tests/unit/test_jax_*.py" = ["E402"]  # pytest.importorskip guards precede imports
"tests/unit/test_bridge_config.py" = ["E402"]  # platform skip markers precede imports
"tests/scripts/test_run_baseline_eval.py" = ["E402"]  # sys.path bootstrap before imports

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
show_error_codes = true
exclude = ["^spaces/"]

[[tool.mypy.overrides]]
module = "tqdm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.cloud.*", "google.api.*", "grpc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alpha_zero.cloud.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "alpha_zero.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "alpha_zero.training.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "alpha_zero.tournament.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "alpha_zero.pbt.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "alpha_zero.web.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "alpha_zero.evaluation.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "alpha_zero.envs.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["fastapi.*", "uvicorn.*", "starlette.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "spacetimedb_sdk.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jax.*", "jaxlib.*", "equinox.*", "optax.*", "jaxtyping.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["huggingface_hub.*", "safetensors.*", "datasets.*", "gradio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alpha_zero.hub.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pyright]
pythonVersion = "3.11"
reportMissingTypeStubs = false
reportMissingModuleSource = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# --strict-markers: an unregistered marker is a collection error, not a warning,
# so a typo'd `@pytest.mark.requires_gcpp` can no longer slip past every `-m`
# filter in CI and run (or never run) unnoticed.
addopts = "-v --tb=short --timeout=120 --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "requires_env: marks tests requiring specific environment setup",
    "security: marks security sanity tests",
    "sanity: marks import and basic sanity tests",
    "cloud: marks cloud integration tests",
    "requires_gcp: marks tests requiring GCP credentials",
    "requires_vertex_ai: marks tests requiring Vertex AI access",
    "requires_multi_gpu: marks tests requiring multiple GPUs",
    "requires_distributed: marks tests requiring distributed training setup",
    "requires_cloud_env: marks tests requiring full cloud environment",
    "e2e: marks tests as end-to-end tests",
    "benchmark: marks tests as benchmarks (deselect with '-m \"not benchmark\"')",
    "web: marks web interface tests",
    "smoke: marks smoke tests for quick validation (select with '-m smoke')",
    "requires_spacetimedb: marks tests requiring running SpacetimeDB instance",
    "requires_jax: marks tests requiring JAX installation (install with pip install -e '.[jax]')",
    "requires_hub: marks tests requiring Hugging Face Hub (install with pip install -e '.[hub]')",
]

[tool.coverage.run]
source = ["alpha_zero"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/__init__.py",
    "*/conftest.py",
    # Cloud / infrastructure (require GCP SDK, Vertex AI, GCS)
    "alpha_zero/cloud/*",
    "alpha_zero/inference/*",
    "alpha_zero/serving/*",
    # Web server (requires running FastAPI)
    "alpha_zero/web/routes/*",
    "alpha_zero/web/app.py",
    # JAX backend (requires JAX framework)
    "alpha_zero/core/jax_*",
    # Game interfaces (require real Civ6 / CivRealm / Docker)
    "alpha_zero/interfaces/base_interface.py",
    "alpha_zero/interfaces/civ6_interface.py",
    "alpha_zero/envs/civrealm_wrapper.py",
    "alpha_zero/envs/real_civ6_env.py",
    # External store backends (require ChromaDB, FAISS, SpacetimeDB)
    "alpha_zero/rag/stores/chroma_store.py",
    "alpha_zero/rag/stores/faiss_store.py",
    "alpha_zero/spacetimedb/*",
    "alpha_zero/storage/gcs_backend.py",
    # Distributed orchestration (requires torch.distributed init + multi-process)
    "alpha_zero/distributed/coordinator.py",
    "alpha_zero/distributed/ddp_learner.py",
    "alpha_zero/distributed/learner.py",
    "alpha_zero/distributed/parameter_server.py",
    # CUDA graph cache (requires CUDA hardware)
    # Orchestrator main entrypoint and run loop - exercised by smoke
    # tests / dry-run flag, not by unit tests
    "alpha_zero/orchestrator/__main__.py",
    "alpha_zero/orchestrator/orchestrator.py",
    # Benchmark scripts (perf reports, not unit-testable)
    "alpha_zero/evaluation/muzero_vs_alphazero_benchmark.py",
    # System monitoring / memory guard (requires real process metrics)
    "alpha_zero/utils/memory_guard.py",
    # Training-time monitoring (requires live training loop)
    "alpha_zero/training/convergence_monitor.py",
    # PBT multi-process coordinator (requires multi-process setup)
    "alpha_zero/pbt/coordinator.py",
    # Deferred modules per CLAUDE.md §13 - not active in training pipeline
    "alpha_zero/mechanics/*",
    "alpha_zero/human_interface/*",
    "alpha_zero/integration/*",
    "alpha_zero/hierarchical/*",
    "alpha_zero/tournament/*",
    # Reflection generator requires async LLM client + persistent vector store
    "alpha_zero/core/reflection_generator.py",
    # LLM / RAG infrastructure (requires API keys, embedding models, vector stores)
    "alpha_zero/utils/llm_client.py",
    "alpha_zero/utils/rag_client.py",
    "alpha_zero/rag/processors/embeddings.py",
    "alpha_zero/rag/agents/*",
    # LLM eval-harness adapter (online branch needs API keys; offline path is unit-tested)
    "alpha_zero/evaluation/llm_harness/*",
    # Evaluation baselines/reports (require trained models, output formatting)
    "alpha_zero/evaluation/baselines.py",
    "alpha_zero/evaluation/baseline_agents.py",
    # Checkpoint I/O utilities (file-system + torch.load, integration-tested)
    "alpha_zero/core/checkpoint_utils.py",
    # Distributed actor (requires multi-process pool)
    "alpha_zero/distributed/actor.py",
    # Optimisations config (legacy, exercised by smoke tests not unit tests)
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
# Mirror of [tool.coverage.run].omit - coverage.py only honours the run-side
# list when collecting (in CI), but local `coverage report` reads an existing
# data file and needs the omit applied at report stage too.
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/__init__.py",
    "*/conftest.py",
    # Cloud / infrastructure (require GCP SDK, Vertex AI, GCS)
    "alpha_zero/cloud/*",
    "alpha_zero/inference/*",
    "alpha_zero/serving/*",
    # Web server (requires running FastAPI)
    "alpha_zero/web/routes/*",
    "alpha_zero/web/app.py",
    # JAX backend (requires JAX framework)
    "alpha_zero/core/jax_*",
    # Game interfaces (require real Civ6 / CivRealm / Docker)
    "alpha_zero/interfaces/base_interface.py",
    "alpha_zero/interfaces/civ6_interface.py",
    "alpha_zero/envs/civrealm_wrapper.py",
    "alpha_zero/envs/real_civ6_env.py",
    # External store backends (require ChromaDB, FAISS, SpacetimeDB)
    "alpha_zero/rag/stores/chroma_store.py",
    "alpha_zero/rag/stores/faiss_store.py",
    "alpha_zero/spacetimedb/*",
    "alpha_zero/storage/gcs_backend.py",
    # Distributed orchestration (requires torch.distributed init + multi-process)
    "alpha_zero/distributed/coordinator.py",
    "alpha_zero/distributed/ddp_learner.py",
    "alpha_zero/distributed/learner.py",
    "alpha_zero/distributed/parameter_server.py",
    # CUDA graph cache (requires CUDA hardware)
    # Orchestrator main entrypoint and run loop - exercised by smoke
    # tests / dry-run flag, not by unit tests
    "alpha_zero/orchestrator/__main__.py",
    "alpha_zero/orchestrator/orchestrator.py",
    # Benchmark scripts (perf reports, not unit-testable)
    "alpha_zero/evaluation/muzero_vs_alphazero_benchmark.py",
    # System monitoring / memory guard (requires real process metrics)
    "alpha_zero/utils/memory_guard.py",
    # Training-time monitoring (requires live training loop)
    "alpha_zero/training/convergence_monitor.py",
    # PBT multi-process coordinator (requires multi-process setup)
    "alpha_zero/pbt/coordinator.py",
    # Deferred modules per CLAUDE.md §13 - not active in training pipeline
    "alpha_zero/mechanics/*",
    "alpha_zero/human_interface/*",
    "alpha_zero/integration/*",
    "alpha_zero/hierarchical/*",
    "alpha_zero/tournament/*",
    # Reflection generator requires async LLM client + persistent vector store
    "alpha_zero/core/reflection_generator.py",
    # LLM / RAG infrastructure (requires API keys, embedding models, vector stores)
    "alpha_zero/utils/llm_client.py",
    "alpha_zero/utils/rag_client.py",
    "alpha_zero/rag/processors/embeddings.py",
    "alpha_zero/rag/agents/*",
    # LLM eval-harness adapter (online branch needs API keys; offline path is unit-tested)
    "alpha_zero/evaluation/llm_harness/*",
    # Evaluation baselines/reports (require trained models, output formatting)
    "alpha_zero/evaluation/baselines.py",
    "alpha_zero/evaluation/baseline_agents.py",
    # Checkpoint I/O utilities (file-system + torch.load, integration-tested)
    "alpha_zero/core/checkpoint_utils.py",
    # Distributed actor (requires multi-process pool)
    "alpha_zero/distributed/actor.py",
    # Optimisations config (legacy, exercised by smoke tests not unit tests)
]
# Coverage gate. CI enforces this via the `--cov-fail-under=85` CLI flag in
# .github/workflows/ci.yml, which OVERRIDES this value; we set 85 here so local
# `pytest --cov` / `coverage report` runs match CI exactly (a single, truthful
# gate). Re-tightened 80 -> 85 on 2026-07-13 after CI measured 89.69% total
# (run 29214300752), leaving ~4.7pt headroom. Next step: shrink the omit list
# above so the gate covers serving/, inference/, and cloud infra too.
fail_under = 85
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
