# Install with `make hooks-install` (installs both pre-commit and pre-push stages).
# The mutating hooks (whitespace, EOF, ruff) are scoped to the maintained code
# paths that CI keeps clean: alpha_zero/, tests/, scripts/, infra/, and root
# *.py runners (widened 2026-07-25 by the harden-lint-and-type-gates change;
# unmaintained fringe dirs are excluded centrally via [tool.ruff]
# extend-exclude + force-exclude in pyproject.toml).
# kb/handoffs/ is excluded because those files are immutable once created.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # `&maintained`: the code paths CI keeps clean. Anchored here (not as a
      # global `files:` default, which would AND with the local hooks' own
      # patterns and disable them) and aliased onto the other mutating hooks.
      - id: trailing-whitespace
        files: &maintained '^(alpha_zero/|tests/|scripts/|infra/|[^/]+\.py$)'
        exclude: ^kb/handoffs/
      - id: end-of-file-fixer
        files: *maintained
        exclude: ^kb/handoffs/
      - id: check-yaml
        args: ["--allow-multiple-documents"]  # k8s manifests use --- separators
      # 200 KB. The largest files a change here legitimately adds are the
      # bandit baseline (~155 KB) and evidence JSON; a checkpoint, a dataset
      # shard or an mlruns/ artifact is far bigger and belongs in GCS or the
      # Hub, never in git history where it cannot be removed.
      - id: check-added-large-files
        args: ["--maxkb=200"]
      - id: check-merge-conflict

  # Same version the Makefile pins (GITLEAKS_VERSION) and CI runs via
  # `make security-secrets`, so a commit is scanned with the ruleset that will
  # judge it. This hook scans the staged diff only; the tree-and-history scan
  # stays in the Makefile target.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: *maintained
      - id: ruff-format
        files: *maintained

  - repo: local
    hooks:
      - id: validate-openspec
        name: validate openspec
        entry: python scripts/validate_openspec.py
        language: system
        files: ^openspec/
        pass_filenames: false
      - id: validate-kb
        name: validate kb
        entry: python scripts/validate_kb.py
        language: system
        files: ^kb/
        pass_filenames: false
      - id: validate-agents
        name: Validate Agent.md persona docs
        entry: python scripts/validate_agents.py
        language: system
        pass_filenames: false
        files: 'Agent\.md$'

      - id: validate-claude-agents
        name: validate SDLC role subagents
        entry: python scripts/validate_claude_agents.py
        language: system
        # Also the two hooks a role attaches and the skills that dispatch roles
        # (C3 and C8 read them), not just the role files.
        files: ^(pyproject\.toml$|\.claude/(agents/|hooks/(readonly_shell_guard|tests_only_write_guard)\.sh$|skills/(planning|dev-sqe|pre-pr)-handoff/))
        pass_filenames: false
      - id: validate-skills
        name: validate skills
        entry: python scripts/validate_skills.py
        language: system
        # Both trees, because the validator scans both (2026-08-30). This
        # pattern named only `.claude/skills/`, so a commit that touched ONLY
        # `.agents/skills/` ran no skills gate at all -- the same half-covered
        # tree that decision was written to close, left open on this side.
        files: ^(\.claude|\.agents)/skills/
        pass_filenames: false
      # `setup.py` was dropped from this pattern 2026-11-10: the project has no
      # setup.py (pyproject.toml is the build definition), so the entry matched
      # nothing. CITATION.cff carries the version too and must move with it.
      - id: check-doc-sync
        name: check doc sync
        entry: python scripts/check_doc_sync.py
        language: system
        files: ^(README\.md|CLAUDE\.md|ROADMAP\.md|PROJECT_CHARTER\.md|CONTRIBUTING\.md|CHANGELOG\.md|SUPPORT\.md|SECURITY\.md|GOVERNANCE\.md|CITATION\.cff|docs/|\.github/workflows/ci\.yml|\.claude/skills/|pyproject\.toml|alpha_zero/(__init__|[^/]+/__init__)\.py)
        pass_filenames: false
      # A hook edit runs the hook-syntax gate (bash -n on every hook, each
      # settings.json command names a real file, no orphan hook) and the hook and
      # guard tests: every file named test_hook_*, test_*guard*, test_qa_shell_*,
      # plus any governance test that names a .claude/hooks/*.sh script. The files
      # are listed by name because pre-commit runs `entry` without a shell, so a
      # glob is never expanded, and `-k` selects by test name and missed
      # test_qa_shell_require_lua.py. test_hook_syntax.py fails when a file that
      # should be here is not, so the list cannot go stale silently. About 60 s;
      # it fires only when a hook or the settings change.
      - id: hook-syntax-and-guards
        name: hook syntax and guard tests
        entry: >-
          python -m pytest -c tests/governance/pytest.ini --confcutdir=tests/governance
          -q -p no:cacheprovider
          tests/governance/test_guard_branch_change.py
          tests/governance/test_guard_cd_certainty.py
          tests/governance/test_guard_cd_splitter.py
          tests/governance/test_guard_copilot_threads.py
          tests/governance/test_guard_decision_json.py
          tests/governance/test_guard_decision_json_portability.py
          tests/governance/test_guard_git_environment.py
          tests/governance/test_guard_json_decision_copy.py
          tests/governance/test_guard_option_table_drift.py
          tests/governance/test_guard_powershell_cd.py
          tests/governance/test_guard_push_bare_tags.py
          tests/governance/test_guard_push_globs.py
          tests/governance/test_guard_push_merged_branch.py
          tests/governance/test_guard_push_syntax.py
          tests/governance/test_guard_push_tag_names.py
          tests/governance/test_guard_review2_git.py
          tests/governance/test_guard_review2_parsing.py
          tests/governance/test_guard_review3.py
          tests/governance/test_guard_review_round1.py
          tests/governance/test_guard_round1_controls.py
          tests/governance/test_guard_sourced_file.py
          tests/governance/test_guard_subshell_cd.py
          tests/governance/test_guard_switch_certainty.py
          tests/governance/test_guard_switch_per_repo.py
          tests/governance/test_guard_target_directory.py
          tests/governance/test_hook_guard_json.py
          tests/governance/test_hook_syntax.py
          tests/governance/test_pretooluse_guard.py
          tests/governance/test_qa_shell_require_lua.py
          tests/governance/test_readonly_shell_guard.py
          tests/governance/test_validate_claude_agents.py
        language: system
        files: ^\.claude/(hooks/|settings\.json$)
        pass_filenames: false
      - id: check-lua-bundle
        name: check Civ6 Lua bundle sync
        entry: python scripts/build_lua_bundle.py --check
        language: system
        # always_run: pre-commit drops deleted files before matching `files`, so a
        # commit that only deletes a module would skip the check. It costs ~50 ms.
        always_run: true
        pass_filenames: false
      # Scoped to tests/regression/ (2026-09-02): the unit suite cannot complete
      # in the dev sandbox, so a pre-push hook running it was either skipped
      # with --no-verify or never finished -- a dead gate either way. CI owns
      # tests/unit/; the regression suite (~10 s, hygiene invariants + known-bug
      # reproductions) is what a push can reasonably be held on locally.
      - id: pytest-check
        name: pytest regression check
        entry: pytest tests/regression/ -x -q --tb=no
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
