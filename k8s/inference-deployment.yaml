# GKE Deployment for Civ6 AlphaZero Inference Service
# Deploy with: kubectl apply -f k8s/inference-deployment.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: civ6az

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-config
  namespace: civ6az
data:
  CIV6AZ_VERTEX_PROJECT: "YOUR_GCP_PROJECT"  # replace before applying
  CIV6AZ_VERTEX_REGION: "us-central1"
  CIV6AZ_GCS_BUCKET: "YOUR_BUCKET"  # replace before applying
  CIV6AZ_GCS_PREFIX: "models/"
  PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:512"
  INFERENCE_PORT: "8080"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alphazero-inference
  namespace: civ6az
  labels:
    app: alphazero-inference
spec:
  replicas: 3  # Start with 3 replicas
  selector:
    matchLabels:
      app: alphazero-inference
  template:
    metadata:
      labels:
        app: alphazero-inference
    spec:
      # Use node pool with GPUs
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-tesla-t4

      containers:
      - name: inference
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT/civ6az/alphazero-inference:latest
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        env:
        - name: PYTHONUNBUFFERED
          value: "1"

        envFrom:
        - configMapRef:
            name: inference-config

        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 12

---
apiVersion: v1
kind: Service
metadata:
  name: alphazero-inference-service
  namespace: civ6az
  labels:
    app: alphazero-inference
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: alphazero-inference

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alphazero-inference-hpa
  namespace: civ6az
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alphazero-inference
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max
