name: Security Scan

# Dependency-level scanning. Code scanning (CodeQL) lives in codeql.yml and the
# OpenSSF Scorecard in scorecard.yml: each of those needs `security-events:
# write`, which this workflow deliberately never holds.
#
# Both jobs are advisory (`continue-on-error: true`) until the maintainer has
# watched a few runs: dependency-review needs the dependency graph, which is
# only on once the repository is public; pip-audit's first runs will show what
# the baseline has to say about the pinned mlflow/torch stacks.
on:
  pull_request:
  push:
    branches:
      - dev
      - qa
      - main
      # The default branch before the rename to `dev`; kept until the
      # cut-over (R4) so the rename cannot open a window with no CI.
      - claude/civ6-alphazero-implementation-vMnun
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ contains(fromJSON('["refs/heads/dev","refs/heads/qa","refs/heads/main","refs/heads/claude/civ6-alphazero-implementation-vMnun"]'), github.ref) && format('-{0}', github.run_id) || '' }}
  # Never cancel or drop a run on a protected branch: every push there is a state
  # the promotion and release gates read. `cancel-in-progress: false` alone is not
  # enough -- a group holds one running and ONE PENDING run, and a third push
  # cancels the pending one, so a middle commit would get no CI and could never
  # be released. A protected-branch push therefore gets a group of its own
  # (`github.run_id`). PR and feature-branch runs keep the shared `github.ref`
  # group and still supersede each other.
  # tests/regression/test_workflow_pinning_regression.py holds this list to the
  # protected-branch list in .claude/settings.json.
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/qa","refs/heads/main","refs/heads/claude/civ6-alphazero-implementation-vMnun"]'), github.ref) }}

jobs:
  dependency-review:
    name: Dependency review
    # The action diffs the PR's dependency manifests against the base; it has
    # nothing to compare on a push or a schedule. It needs the dependency graph,
    # which GitHub provides free on public repositories but only with Advanced
    # Security on private ones, so it is skipped while the repository is private
    # (a job-level continue-on-error still paints the check run red, which is
    # noise, not information) and starts running the moment the repo is public.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes (advisory)
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  pip-audit:
    name: pip-audit (container requirements + dev install)
    # Scheduled, manual, and on pushes to the default branch; pull requests get
    # dependency-review above instead of a second resolver run.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Advisory at step level: a job-level continue-on-error still reports the
    # check run as failed, so the audit steps carry it individually instead.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install the project (dev extra) and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit==2.10.1

      # pip-audit exits 1 when it finds something and 0 when it does not; both
      # are "the tool worked". Anything else is a tool failure and fails the
      # step. The decision about findings belongs to the baseline diff below,
      # not to pip-audit's own exit code.
      - name: Audit the container requirements (what the deployed image installs)
        continue-on-error: true
        run: |
          pip-audit -r requirements-container.txt --format json --output audit-container.json --progress-spinner off
          status=$?
          [ "$status" -le 1 ] || exit "$status"
        shell: bash {0}

      - name: Audit the installed dev environment
        continue-on-error: true
        run: |
          pip-audit --format json --output audit-dev.json --progress-spinner off
          status=$?
          [ "$status" -le 1 ] || exit "$status"
        shell: bash {0}

      # Exit 1 only on a finding that is not in the baseline. Expired baseline
      # entries warn here; add --strict to fail on them once the baseline has
      # been curated.
      - name: Compare findings against the accepted baseline
        continue-on-error: true
        run: >
          python scripts/diff_audit_baseline.py
          audit-container.json audit-dev.json .security/pip-audit-baseline.toml

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pip-audit-reports
          path: |
            audit-container.json
            audit-dev.json
          if-no-files-found: warn
