name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Workflow default is read-only; only the job that actually publishes the
# release is granted `contents: write` (job-level permissions replace, not
# extend, the workflow-level block).
permissions:
  contents: read

# One release at a time per tag, and never cancel one half-way: a cancelled
# run can leave a tag with a release but no assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Plan S3.5. Every rule here is also pre-checked by the maintainer's
  # scripts/maintainer/tag_release.py; both call scripts/release_checks.py so the
  # two cannot drift. A tag that fails here publishes nothing.
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # a final with no rc must be the merge of a hotfix/* PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ancestry against origin/qa and origin/main, and every rc tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Version (${version%%-*} == pyproject), ancestry (an rc is in qa with main
      # as an ancestor; a final is in main), and the final-tag rule (the diff from
      # the highest rc touches only docs/evidence/**, or there is no rc and the
      # tagged merge came from a hotfix/* PR).
      - name: Version, ancestry and final-tag rules
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: python -m scripts.release_checks verify-tag --tag "$TAG" --sha "$(git rev-parse "${GITHUB_REF}^{commit}")"

  # Branch protection proves the PR's checks passed when it merged; it does not
  # prove CI passed on the merge commit being tagged, and a second merge could
  # have cancelled that run. This job waits for both before anything publishes.
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Push checks (the eight CI jobs that run on push) on the tagged commit;
      # PR-only checks (Branch Direction, and Release Evidence for a non-hotfix
      # final) on the head of the one merged PR whose merge_commit_sha is the
      # tagged commit (GET /commits/$SHA/pulls).
      - name: Wait for push and PR checks
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          python -m scripts.release_checks wait-for-ci --tag "$TAG"
          --sha "$(git rev-parse "${GITHUB_REF}^{commit}")" --timeout-minutes 95

  release:
    name: Build and publish release
    needs: [verify-tag, wait-for-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # CONFIRM-FIRST: the provenance attestation step below additionally needs
      #   id-token: write       # OIDC token to sign the attestation with Sigstore
      #   attestations: write   # store the attestation against this repository
      # Add both here when enabling it; neither is granted until then.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for the commit-log fallback notes
          # Nothing here pushes; `gh release create` authenticates with GH_TOKEN,
          # not with a token left in .git/config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Extract version from tag
        id: version
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"

      # The repository carries the BASE version (X.Y.Z) through the whole rc
      # cycle; ${version%%-*} must equal pyproject.toml (verify-tag already
      # enforced it on the tagged commit; this re-reads the file being built).
      # An rc then stamps PEP 440 X.Y.ZrcN into this build copy only, so the
      # wheel is versioned as the pre-release it is. Nothing is committed.
      - name: Check and stamp the build version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m scripts.release_version check --tag "$TAG"
          python -m scripts.release_version stamp --tag "$TAG" --pyproject pyproject.toml --init alpha_zero/__init__.py

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build==1.6.1
          python -m build
          ls -l dist/

      # Written from inside dist/ so the sums file names bare filenames, which is
      # what `sha256sum -c SHA256SUMS` expects when run next to the downloads.
      - name: Write checksums
        run: |
          cd dist
          sha256sum ./*.whl ./*.tar.gz | sed 's#\./##' > SHA256SUMS
          cat SHA256SUMS

      # Preferred notes: the BASE version's `## [X.Y.Z]` section of CHANGELOG.md
      # (for an rc as for the final; the CHANGELOG is final at the rc). Exit 3
      # means no such section: `found=false` hands over to the commit-log
      # fallback below rather than publishing an empty body.
      - name: Release notes from CHANGELOG.md
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          status=0
          python -m scripts.release_version notes --tag "$TAG" --repo "$GITHUB_REPOSITORY" --out release_notes.md || status=$?
          case "$status" in
            0) echo "found=true" >> "$GITHUB_OUTPUT" ;;
            3)
              echo "::warning::CHANGELOG.md has no section for this version; release notes will be generated from the commit log instead"
              echo "found=false" >> "$GITHUB_OUTPUT"
              ;;
            *) exit "$status" ;;
          esac

      # Fallback: categorised conventional commits since the previous tag. Safe
      # on the FIRST release: with no previous tag `git describe` fails, the
      # range becomes the whole history capped at 200 commits, and the footer
      # links to the tag's commit list instead of a compare URL that would 404.
      - name: Release notes from commit history (fallback)
        if: steps.changelog.outputs.found != 'true'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
            LIMIT="--max-count=200"
          else
            RANGE="${PREV_TAG}..HEAD"
            LIMIT=""
          fi

          {
            echo "## What's Changed"
            echo ""
          } > release_notes.md

          section() {
            local title="$1" pattern="$2" prefix="$3"
            local lines
            # shellcheck disable=SC2086
            lines=$(git log $RANGE $LIMIT --pretty=format:"%s" | grep -E "^${pattern}" | sed -E "s/^[^:]*: /- ${prefix} /" || true)
            if [ -n "$lines" ]; then
              {
                echo "### ${title}"
                echo "$lines"
                echo ""
              } >> release_notes.md
            fi
          }

          section "✨ Features"      "feat"            "✨"
          section "🐛 Bug Fixes"     "fix"             "🐛"
          section "🚀 Performance"   "perf"            "🚀"
          section "🧪 Tests"         "test"            "🧪"
          section "📚 Documentation" "docs"            "📚"
          section "⚙️ CI & Build"    "(ci|build)"      "⚙️"
          section "🔧 Maintenance"   "(chore|refactor)" "🔧"

          echo "" >> release_notes.md
          if [ -n "$PREV_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...v${RELEASE_VERSION}" >> release_notes.md
          else
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/v${RELEASE_VERSION} (first tagged release)" >> release_notes.md
          fi
          cat release_notes.md

      # SLSA build provenance for every artifact in dist/. Disabled until the
      # maintainer approves the two extra token scopes documented in the job's
      # `permissions:` block above; attestations are visible on the repository's
      # Attestations page and verifiable with `gh attestation verify`.
      - name: Attest build provenance
        if: false # CONFIRM-FIRST: enable after maintainer approves id-token/attestations permissions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # `gh` ships on the runner, so no third-party action needs to hold the one
      # `contents: write` token in this repository (this replaced
      # softprops/action-gh-release on 2026-11-10; zizmor flagged it as
      # superfluous, and its pin comment had drifted from the SHA it annotated).
      # The tag name reaches the script through `env`, not `${{ }}` inside
      # `run:`, so it cannot be interpolated as shell.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file release_notes.md \
            $prerelease
