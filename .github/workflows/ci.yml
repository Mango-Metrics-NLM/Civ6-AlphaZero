name: CI

on:
  push:
    # The protected branches (dev, qa, main -- plan S3.1) plus the pre-rename
    # default branch, deliberately concrete. Listing the old name until the
    # cut-over means the rename cannot open a window in which pushes to the
    # default branch run no CI, and
    # tests/regression/test_workflow_pinning_regression.py holds this list to
    # {protected branches in .claude/settings.json, default branch, globs} so a
    # stale name cannot creep back in.
    # `feature/*` and `next-steps-*` were dropped 2026-11-10: `git branch -r`
    # showed no branch matching either. `claude/**` stays because agent working
    # branches push there and want a CI run before a pull request exists.
    branches:
      - dev
      - qa
      - main
      # The default branch before the rename to `dev`; kept until the
      # cut-over (R4) so the rename cannot open a window with no CI.
      - claude/civ6-alphazero-implementation-vMnun
      - "claude/**"
  # No `branches:` filter, deliberately. It used to read `branches: [main]`,
  # but this repository's default branch is not `main` -- it is
  # `claude/civ6-alphazero-implementation-vMnun`. Pull requests into the real
  # default branch therefore never produced a `pull_request`-event run, and were
  # covered only incidentally by the `push` trigger above. Anything that is
  # `pull_request`-only (fork PRs, a future dependency-review or CodeQL job,
  # path filters) silently never fired. Listing branch names here re-creates the
  # same trap the next time the default branch is renamed, so every PR runs CI.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ contains(fromJSON('["refs/heads/dev","refs/heads/qa","refs/heads/main","refs/heads/claude/civ6-alphazero-implementation-vMnun"]'), github.ref) && format('-{0}', github.run_id) || '' }}
  # Never cancel or drop a run on a protected branch: every push there is a state
  # the promotion and release gates read. `cancel-in-progress: false` alone is not
  # enough -- a group holds one running and ONE PENDING run, and a third push
  # cancels the pending one, so a middle commit would get no CI and could never
  # be released. A protected-branch push therefore gets a group of its own
  # (`github.run_id`). PR and feature-branch runs keep the shared `github.ref`
  # group and still supersede each other.
  # tests/regression/test_workflow_pinning_regression.py holds this list to the
  # protected-branch list in .claude/settings.json.
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/qa","refs/heads/main","refs/heads/claude/civ6-alphazero-implementation-vMnun"]'), github.ref) }}

# Least privilege for the default GITHUB_TOKEN. Every job here only checks out
# and uploads artifacts (actions/upload-artifact needs no extra scope); none
# writes to the repository, packages, or PRs. Every checkout also sets
# `persist-credentials: false`: no step here pushes, so the token has no
# business sitting in .git/config where any later step (or an uploaded
# artifact that happens to include .git) can read it.
permissions:
  contents: read

env:
  # Every job that installs the package installs torch from the CPU wheel index
  # FIRST, then `pip install -e ".[dev]"` finds the requirement already
  # satisfied and never resolves the default PyPI build -- which on a Linux
  # runner is the CUDA build plus ~2.6 GB of nvidia-*/triton wheels. PR #132's
  # test job failed before a single test ran on a cut-off triton download.
  # The version floor stays in pyproject.toml; this only chooses the index.
  # TORCH_FLAVOR is part of every pip cache key so a cache built against one
  # index is never restored for the other.
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
  TORCH_FLAVOR: cpu

jobs:
  lint:
    name: Lint & Type Check
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Keyed on pyproject.toml alone: it is the only file CI installs from.
      # requirements.txt is a drifting mirror that no job reads, so hashing it
      # only invalidated the cache for changes that could not affect the install.
      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-torch-${{ env.TORCH_FLAVOR }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-torch-${{ env.TORCH_FLAVOR }}-

      # The dev extra pins ruff/mypy (same versions as .pre-commit-config.yaml)
      # and installs the project itself, so mypy sees real dependencies instead
      # of treating every third-party import as Any.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.0.0" --index-url "$TORCH_INDEX_URL"  # CPU wheel first; see env.TORCH_INDEX_URL
          pip install -e ".[dev]"

      - name: Run ruff linter
        run: ruff check . --output-format=github

      - name: Run ruff formatter check
        run: ruff format --check .

      # Blocking since 2026-07-25 (harden-lint-and-type-gates): errors were
      # burned down 130 -> 0 and the advisory step ran green in this exact
      # environment (run 30169685310) before the flip.
      - name: Run mypy type checker
        run: mypy alpha_zero/ --show-error-codes

  test:
    name: Test (Python ${{ matrix.python-version }})
    timeout-minutes: 40
    runs-on: ubuntu-latest
    # 3.13 is advisory: `experimental: true` lets it fail without failing the
    # workflow, so a 3.13-only break is visible in the run but does not block a
    # merge. Promote it to the required list by moving it into `python-version`
    # once it has run green for a few weeks.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        experimental: [false]
        include:
          - python-version: "3.13"
            experimental: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: tests/regression/test_coverage_floors_ratchet.py
          # compares coverage-floors.json against its merge base, which a
          # depth-1 checkout cannot resolve -- the ratchet then skipped on every
          # CI run and only ever ran on a developer's machine.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-torch-${{ env.TORCH_FLAVOR }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-torch-${{ env.TORCH_FLAVOR }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.0.0" --index-url "$TORCH_INDEX_URL"  # CPU wheel first; see env.TORCH_INDEX_URL
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short -x -m "not slow"

      - name: Run sanity tests
        run: pytest tests/sanity/ -v --tb=short

      # Repository-hygiene and known-bug reproductions. This suite existed but was
      # wired into nothing -- no CI job and no make target ran it -- so its
      # invariants could regress with CI green.
      - name: Run regression tests
        run: pytest tests/regression/ -v --tb=short

      - name: Run integration tests (non-slow)
        run: pytest tests/integration/ -v --tb=short -m "not slow and not requires_env" -x

      # The four suites below were in the same position tests/regression/ was:
      # present, passing when run by hand, and enumerated by no job and no make
      # target. tests/scripts/ was hiding three real failures because of it.
      # tests/inference/ rides along with tests/smoke/ rather than getting its
      # own step: every module in it is `pytest.importorskip`-guarded on the
      # `web` extra, so alone it collects nothing and pytest exits 5 ("no tests
      # collected") -- a red build for a suite behaving exactly as designed.
      # Paired, it still gates: a failure in it fails this step.
      - name: Run smoke and inference tests
        run: pytest tests/smoke/ tests/inference/ -v --tb=short

      - name: Run script tests
        run: pytest tests/scripts/ -v --tb=short -m "not requires_env"

      - name: Run end-to-end tests
        run: pytest tests/e2e/ -v --tb=short -m "not slow and not requires_env"

  cloud-tests:
    name: Cloud Unit Tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-cloud-torch-${{ env.TORCH_FLAVOR }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-cloud-torch-${{ env.TORCH_FLAVOR }}-

      # pytest-cov comes from the dev extra; the bare `pytest-cov` that used to
      # trail this line installed an unpinned second copy for nothing.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.0.0" --index-url "$TORCH_INDEX_URL"  # CPU wheel first; see env.TORCH_INDEX_URL
          pip install -e ".[dev]"

      # alpha_zero/cloud/* is omitted from the global gate, so the deployed path
      # was unmeasured by any job. These tests already exercised it; they now
      # also measure it, against the per-package floor in coverage-floors.json.
      # A separate coverage config is used because the repo-wide one omits the
      # very package being measured here.
      - name: Run cloud unit tests
        run: >
          pytest tests/cloud/unit/ -v --tb=short -x
          --cov=alpha_zero.cloud --cov-config=.coveragerc-cloud --cov-report=

      - name: Run cloud smoke tests
        run: >
          pytest tests/cloud/smoke/ -v --tb=short
          --cov=alpha_zero.cloud --cov-config=.coveragerc-cloud --cov-append --cov-report=

      # --rcfile is required, not cosmetic: without it `coverage json` reads
      # pyproject.toml, whose omit list drops alpha_zero/cloud/* — the report
      # comes back empty and the floor check has nothing to measure.
      - name: Enforce cloud coverage floor
        run: |
          coverage json --rcfile=.coveragerc-cloud -o coverage-cloud.json
          python scripts/check_coverage_floors.py --report coverage-cloud.json --package alpha_zero/cloud

  security:
    name: Security Scan
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: `gitleaks git` scans every commit, and a secret removed
          # in a later commit is still published in the one that added it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.0.0" --index-url "$TORCH_INDEX_URL"  # CPU wheel first; see env.TORCH_INDEX_URL
          pip install -e ".[dev]"

      - name: Run security sanity tests
        run: pytest tests/security/ -v --tb=short

      # One definition of the secret gate, in the Makefile, invoked identically
      # here. This job used to restate the install and both scan commands, which
      # is how it came to run `gitleaks dir .` -- reading gitignored files --
      # while the Makefile comment beside it claimed a tracked-tree scan. The
      # target installs its own version-pinned binary (SHA-256 verified against
      # the pin in the Makefile); scoping to HEAD's lineage and staging the
      # committable file set are documented there.
      - name: Scan for secrets (tracked tree + this branch's history)
        run: make security-secrets

      # Blocking: high severity AND high confidence over the package. Zero
      # findings today; a new one is a real defect.
      - name: Run bandit security scan (high/high, blocking)
        run: bandit -r alpha_zero/ -s B101 --severity-level high --confidence-level high -f json -o bandit-report.json

      - name: Upload bandit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

      # Advisory: medium severity / medium confidence over the package, the
      # scripts and the launcher, reported against the accepted-findings
      # baseline so only NEW findings appear in the report. The baseline was
      # generated on 2026-11-10 (30 findings, all reviewed as accepted or
      # tracked) with exactly the command in the Makefile's
      # `test-security-medium` comment. continue-on-error until the maintainer
      # has watched a few runs; flip it to blocking by deleting that line.
      - name: Run bandit security scan (medium/medium vs baseline, advisory)
        continue-on-error: true
        run: >
          bandit -r alpha_zero scripts infra -s B101 -ll -ii
          -b .security/bandit-baseline.json -f json -o bandit-medium-report.json

      - name: Upload bandit medium report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bandit-medium-report
          path: bandit-medium-report.json

  governance:
    name: Governance Gates
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: validate_kb.py --git makes the handoff-immutability
          # check (K7) mandatory and FAILS on a shallow clone, so this must stay.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Both pinned. tests/regression/test_workflow_pinning_regression.py fails
      # any `pip install <name>` here without `==`, because an unpinned tool in
      # a gate is a gate whose definition changes under you.
      - name: Install governance tools
        run: pip install ruff==0.15.8 pytest==9.2.0

      - name: Lint governance code
        run: >-
          ruff check
          scripts/validate_openspec.py scripts/validate_kb.py
          scripts/validate_skills.py scripts/validate_agents.py
          scripts/check_doc_sync.py
          tests/governance/

      - name: Validate OpenSpec structure
        run: python scripts/validate_openspec.py

      - name: Validate KB workflow
        run: python scripts/validate_kb.py --git

      - name: Validate skills
        run: python scripts/validate_skills.py

      - name: Validate Agent.md persona docs
        run: python scripts/validate_agents.py

      - name: Check documentation sync
        run: python scripts/check_doc_sync.py

      - name: Run governance tests
        run: >-
          pytest -c tests/governance/pytest.ini
          --confcutdir=tests/governance -p no:cacheprovider tests/governance

      # Static audit of the workflows themselves (unpinned actions, persisted
      # credentials, template injection, excessive permissions). --offline so
      # it needs no token and cannot be rate-limited. Advisory for now: the
      # 2026-11-10 local run was clean after the persist-credentials and
      # template-injection fixes landed; make it blocking once a few CI runs
      # agree.
      - name: Install zizmor
        run: pip install zizmor==1.32.0

      - name: Audit workflows with zizmor (advisory)
        continue-on-error: true
        run: zizmor --offline .github/workflows

  eval-harness:
    name: LLM Eval Harness
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Enforcing since 2026-07-25 (harden-lint-and-type-gates): the observation
    # window closed with consecutive green runs, e.g. run 30156956859 on the
    # PR #93 merge commit (gate step green, ~6 s). The offline gate is
    # deterministic (stub LLM), so failures here are real contract regressions.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-eval-torch-${{ env.TORCH_FLAVOR }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-eval-torch-${{ env.TORCH_FLAVOR }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.0.0" --index-url "$TORCH_INDEX_URL"  # CPU wheel first; see env.TORCH_INDEX_URL
          pip install -e ".[eval]"

      - name: Probe eval-harness import (distinguishes deps-broke from gate-failed)
        run: python -c "import eval_harness; print('eval_harness importable')"

      - name: Run the StrategyAdvisor output-contract gate
        run: make eval-llm

  coverage:
    name: Coverage Report
    timeout-minutes: 50
    runs-on: ubuntu-latest
    needs: [lint, test, cloud-tests, security]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # This job runs tests/regression/ too, so the floor ratchet needs a
          # resolvable merge base here as well (see the test job).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-cov-torch-${{ env.TORCH_FLAVOR }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-cov-torch-${{ env.TORCH_FLAVOR }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.0.0" --index-url "$TORCH_INDEX_URL"  # CPU wheel first; see env.TORCH_INDEX_URL
          pip install -e ".[dev]"

      # `--ignore=tests/unit/test_distributed` was removed 2026-09-02: that
      # directory has never existed (the DDP suites are flat
      # tests/unit/test_distributed_*.py files), so the flag was a no-op.
      #
      # The Codecov upload was removed at the same time rather than made
      # blocking: no CODECOV_TOKEN secret is referenced by this workflow, so
      # `fail_ci_if_error: true` would turn every tokenless-upload rate limit
      # into a red build. `--cov-fail-under=85` is the coverage gate; the XML
      # is still produced for local inspection.
      - name: Run tests with coverage
        run: |
          pytest tests/unit/ tests/sanity/ tests/integration/ tests/cloud/unit/ tests/regression/ \
            --cov=alpha_zero \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -m "not slow and not requires_env"
