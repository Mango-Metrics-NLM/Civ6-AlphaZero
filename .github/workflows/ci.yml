name: CI

on:
  push:
    branches: [main, "feature/*", "next-steps-*", "claude/*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install ruff mypy pydantic structlog

      - name: Run ruff (alpha_zero)
        run: ruff check alpha_zero/ --output-format=github

      - name: Run ruff (SDK src/)
        run: ruff check src/ --output-format=github

      - name: Run mypy (alpha_zero)
        run: mypy alpha_zero/ --ignore-missing-imports --show-error-codes

      - name: Run mypy (SDK src/)
        run: mypy src/ --ignore-missing-imports --disable-error-code=import-untyped --no-warn-unused-ignores --show-error-codes

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements.txt', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short -x

      - name: Run integration tests (non-slow)
        run: pytest tests/integration/ -v --tb=short -m "not slow and not requires_env" -x

  test-sdk:
    name: SDK Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements.txt', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install SDK dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic structlog pyyaml numpy pytest pytest-cov

      - name: Run SDK unit tests
        run: pytest tests/unit/core/ tests/unit/environments/ tests/unit/adapters/ tests/unit/test_cli.py -v --tb=short -x

      - name: Run SDK smoke tests
        run: pytest tests/smoke/ -v --tb=short -x

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [lint, test, test-sdk]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements.txt', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov pydantic structlog

      - name: Run alpha_zero tests with coverage
        run: |
          pytest tests/ --cov=alpha_zero --cov-report=xml:coverage-az.xml --cov-report=term-missing --cov-fail-under=65 || true

      - name: Run SDK tests with coverage
        run: |
          pytest tests/unit/core/ tests/unit/environments/ tests/unit/adapters/ tests/unit/test_cli.py tests/smoke/ --cov=src --cov-report=xml:coverage-sdk.xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-az.xml,./coverage-sdk.xml
          fail_ci_if_error: false
