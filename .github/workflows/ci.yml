name: CI

on:
  push:
    branches: [main, "feature/*", "next-steps-*", "claude/**"]
  # No `branches:` filter, deliberately. It used to read `branches: [main]`,
  # but this repository's default branch is not `main` -- it is
  # `claude/civ6-alphazero-implementation-vMnun`. Pull requests into the real
  # default branch therefore never produced a `pull_request`-event run, and were
  # covered only incidentally by the `push` trigger above. Anything that is
  # `pull_request`-only (fork PRs, a future dependency-review or CodeQL job,
  # path filters) silently never fired. Listing branch names here re-creates the
  # same trap the next time the default branch is renamed, so every PR runs CI.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the default GITHUB_TOKEN. Every job here only checks out
# and uploads artifacts (actions/upload-artifact needs no extra scope); none
# writes to the repository, packages, or PRs.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      # The dev extra pins ruff/mypy (same versions as .pre-commit-config.yaml)
      # and installs the project itself, so mypy sees real dependencies instead
      # of treating every third-party import as Any.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff linter
        run: ruff check . --output-format=github

      - name: Run ruff formatter check
        run: ruff format --check .

      # Blocking since 2026-07-25 (harden-lint-and-type-gates): errors were
      # burned down 130 -> 0 and the advisory step ran green in this exact
      # environment (run 30169685310) before the flip.
      - name: Run mypy type checker
        run: mypy alpha_zero/ --show-error-codes

  test:
    name: Test (Python ${{ matrix.python-version }})
    timeout-minutes: 40
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short -x -m "not slow"

      - name: Run sanity tests
        run: pytest tests/sanity/ -v --tb=short

      # Repository-hygiene and known-bug reproductions. This suite existed but was
      # wired into nothing -- no CI job and no make target ran it -- so its
      # invariants could regress with CI green.
      - name: Run regression tests
        run: pytest tests/regression/ -v --tb=short

      - name: Run integration tests (non-slow)
        run: pytest tests/integration/ -v --tb=short -m "not slow and not requires_env" -x

      # The four suites below were in the same position tests/regression/ was:
      # present, passing when run by hand, and enumerated by no job and no make
      # target. tests/scripts/ was hiding three real failures because of it.
      # tests/inference/ rides along with tests/smoke/ rather than getting its
      # own step: every module in it is `pytest.importorskip`-guarded on the
      # `web` extra, so alone it collects nothing and pytest exits 5 ("no tests
      # collected") -- a red build for a suite behaving exactly as designed.
      # Paired, it still gates: a failure in it fails this step.
      - name: Run smoke and inference tests
        run: pytest tests/smoke/ tests/inference/ -v --tb=short

      - name: Run script tests
        run: pytest tests/scripts/ -v --tb=short -m "not requires_env"

      - name: Run end-to-end tests
        run: pytest tests/e2e/ -v --tb=short -m "not slow and not requires_env"

  cloud-tests:
    name: Cloud Unit Tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-cloud-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-cloud-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov

      # alpha_zero/cloud/* is omitted from the global gate, so the deployed path
      # was unmeasured by any job. These tests already exercised it; they now
      # also measure it, against the per-package floor in coverage-floors.json.
      # A separate coverage config is used because the repo-wide one omits the
      # very package being measured here.
      - name: Run cloud unit tests
        run: >
          pytest tests/cloud/unit/ -v --tb=short -x
          --cov=alpha_zero.cloud --cov-config=.coveragerc-cloud --cov-report=

      - name: Run cloud smoke tests
        run: >
          pytest tests/cloud/smoke/ -v --tb=short
          --cov=alpha_zero.cloud --cov-config=.coveragerc-cloud --cov-append --cov-report=

      # --rcfile is required, not cosmetic: without it `coverage json` reads
      # pyproject.toml, whose omit list drops alpha_zero/cloud/* — the report
      # comes back empty and the floor check has nothing to measure.
      - name: Enforce cloud coverage floor
        run: |
          coverage json --rcfile=.coveragerc-cloud -o coverage-cloud.json
          python scripts/check_coverage_floors.py --report coverage-cloud.json --package alpha_zero/cloud

  security:
    name: Security Scan
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: `gitleaks git` scans every commit, and a secret removed
          # in a later commit is still published in the one that added it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run security sanity tests
        run: pytest tests/security/ -v --tb=short

      # One definition of the secret gate, in the Makefile, invoked identically
      # here. This job used to restate the install and both scan commands, which
      # is how it came to run `gitleaks dir .` -- reading gitignored files --
      # while the Makefile comment beside it claimed a tracked-tree scan. The
      # target installs its own version-pinned binary; scoping to HEAD's lineage
      # and staging the committable file set are documented there.
      - name: Scan for secrets (tracked tree + this branch's history)
        run: make security-secrets

      - name: Run bandit security scan
        run: bandit -r alpha_zero/ -s B101 --severity-level high --confidence-level high -f json -o bandit-report.json

      - name: Upload bandit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  governance:
    name: Governance Gates
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so validate_kb.py's handoff-immutability check (added in a
          # later phase) can resolve origin/main on push events.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install governance tools
        run: pip install ruff==0.15.8 pytest

      - name: Lint governance code
        run: >-
          ruff check
          scripts/validate_openspec.py scripts/validate_kb.py
          scripts/validate_skills.py scripts/validate_agents.py
          scripts/check_doc_sync.py
          tests/governance/

      - name: Validate OpenSpec structure
        run: python scripts/validate_openspec.py

      - name: Validate KB workflow
        run: python scripts/validate_kb.py --git

      - name: Validate skills
        run: python scripts/validate_skills.py

      - name: Validate Agent.md persona docs
        run: python scripts/validate_agents.py

      - name: Check documentation sync
        run: python scripts/check_doc_sync.py

      - name: Run governance tests
        run: >-
          pytest -c tests/governance/pytest.ini
          --confcutdir=tests/governance -p no:cacheprovider tests/governance

  eval-harness:
    name: LLM Eval Harness
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Enforcing since 2026-07-25 (harden-lint-and-type-gates): the observation
    # window closed with consecutive green runs, e.g. run 30156956859 on the
    # PR #93 merge commit (gate step green, ~6 s). The offline gate is
    # deterministic (stub LLM), so failures here are real contract regressions.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-eval-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-eval-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[eval]"

      - name: Probe eval-harness import (distinguishes deps-broke from gate-failed)
        run: python -c "import eval_harness; print('eval_harness importable')"

      - name: Run LLM eval gate
        run: make eval-llm

  coverage:
    name: Coverage Report
    timeout-minutes: 50
    runs-on: ubuntu-latest
    needs: [lint, test, cloud-tests, security]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-cov-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-cov-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov

      # `--ignore=tests/unit/test_distributed` was removed 2026-09-02: that
      # directory has never existed (the DDP suites are flat
      # tests/unit/test_distributed_*.py files), so the flag was a no-op.
      #
      # The Codecov upload was removed at the same time rather than made
      # blocking: no CODECOV_TOKEN secret is referenced by this workflow, so
      # `fail_ci_if_error: true` would turn every tokenless-upload rate limit
      # into a red build. `--cov-fail-under=85` is the coverage gate; the XML
      # is still produced for local inspection.
      - name: Run tests with coverage
        run: |
          pytest tests/unit/ tests/sanity/ tests/integration/ tests/cloud/unit/ tests/regression/ \
            --cov=alpha_zero \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -m "not slow and not requires_env"
