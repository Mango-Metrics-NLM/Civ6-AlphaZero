name: CI

on:
  push:
    branches: [main, "feature/*", "next-steps-*", "claude/*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install ruff==0.8.0 mypy==1.13.0 bandit==1.8.0 pydantic structlog

      - name: Run ruff linter (alpha_zero)
        run: ruff check alpha_zero/ --output-format=github

      - name: Run ruff linter (SDK src/)
        run: ruff check src/ --output-format=github

      - name: Run ruff formatter check
        run: ruff format --check alpha_zero/

      - name: Run mypy type checker (alpha_zero)
        continue-on-error: true
        run: mypy alpha_zero/ --ignore-missing-imports --show-error-codes

      - name: Run mypy (SDK src/)
        run: mypy src/ --ignore-missing-imports --disable-error-code=import-untyped --no-warn-unused-ignores --show-error-codes

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements.txt', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests (alpha_zero only)
        run: >-
          pytest tests/unit/ -v --tb=short -x -m "not slow"
          --ignore=tests/unit/core
          --ignore=tests/unit/environments
          --ignore=tests/unit/adapters
          --ignore=tests/unit/test_cli.py

      - name: Run sanity tests
        run: pytest tests/sanity/ -v --tb=short

      - name: Run integration tests (non-slow, alpha_zero only)
        run: >-
          pytest tests/integration/ -v --tb=short -x
          -m "not slow and not requires_env"
          --ignore=tests/integration/test_sdk_integration.py

  test-sdk:
    name: SDK Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements.txt', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install SDK dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic structlog pyyaml numpy pytest pytest-cov pytest-asyncio

      - name: Run SDK unit tests
        run: pytest tests/unit/core/ tests/unit/environments/ tests/unit/adapters/ tests/unit/test_cli.py -v --tb=short -x

      - name: Run SDK integration tests
        run: pytest tests/integration/test_sdk_integration.py -v --tb=short -x

      - name: Run SDK smoke tests
        run: pytest tests/smoke/ -v --tb=short -x

  cloud-tests:
    name: Cloud Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-cloud-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-cloud-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run cloud unit tests
        run: pytest tests/cloud/unit/ -v --tb=short -x

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run security sanity tests
        run: pytest tests/security/ -v --tb=short

      - name: Run bandit security scan
        run: bandit -r alpha_zero/ -s B101 --severity-level high --confidence-level high -f json -o bandit-report.json

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [lint, test, test-sdk, cloud-tests, security]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-cov-${{ hashFiles('**/pyproject.toml', '**/requirements.txt', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-cov-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov pydantic structlog pyyaml numpy

      - name: Run alpha_zero tests with coverage
        run: >-
          pytest tests/unit/ tests/integration/
          --ignore=tests/unit/core
          --ignore=tests/unit/environments
          --ignore=tests/unit/adapters
          --ignore=tests/unit/test_cli.py
          --ignore=tests/integration/test_sdk_integration.py
          -m "not slow and not requires_env"
          --cov=alpha_zero
          --cov-report=xml:coverage-az.xml
          --cov-report=term-missing
          --cov-fail-under=65

      - name: Run SDK tests with coverage
        run: >-
          pytest tests/unit/core/ tests/unit/environments/ tests/unit/adapters/
          tests/unit/test_cli.py tests/integration/test_sdk_integration.py tests/smoke/
          --cov=src
          --cov-report=xml:coverage-sdk.xml
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-az.xml,./coverage-sdk.xml
          fail_ci_if_error: false
