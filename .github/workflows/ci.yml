name: CI

on:
  push:
    branches: [main, "feature/*", "next-steps-*", "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/pyproject.toml', '**/requirements.txt', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      # The dev extra pins ruff/mypy (same versions as .pre-commit-config.yaml)
      # and installs the project itself, so mypy sees real dependencies instead
      # of treating every third-party import as Any.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff linter
        run: ruff check . --output-format=github

      - name: Run ruff formatter check
        run: ruff format --check .

      - name: Run mypy type checker
        continue-on-error: true
        run: mypy alpha_zero/ --show-error-codes

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements.txt', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short -x -m "not slow"

      - name: Run sanity tests
        run: pytest tests/sanity/ -v --tb=short

      - name: Run integration tests (non-slow)
        run: pytest tests/integration/ -v --tb=short -m "not slow and not requires_env" -x

  cloud-tests:
    name: Cloud Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-cloud-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-cloud-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run cloud unit tests
        run: pytest tests/cloud/unit/ -v --tb=short -x

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run security sanity tests
        run: pytest tests/security/ -v --tb=short

      - name: Run bandit security scan
        run: bandit -r alpha_zero/ -s B101 --severity-level high --confidence-level high -f json -o bandit-report.json

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  governance:
    name: Governance Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so validate_kb.py's handoff-immutability check (added in a
          # later phase) can resolve origin/main on push events.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install governance tools
        run: pip install ruff==0.15.8 pytest

      - name: Lint governance code
        run: >-
          ruff check
          scripts/validate_openspec.py scripts/validate_kb.py
          scripts/validate_skills.py scripts/check_doc_sync.py
          tests/governance/

      - name: Validate OpenSpec structure
        run: python scripts/validate_openspec.py

      - name: Validate KB workflow
        run: python scripts/validate_kb.py --git

      - name: Validate skills
        run: python scripts/validate_skills.py

      - name: Check documentation sync
        run: python scripts/check_doc_sync.py

      - name: Run governance tests
        run: >-
          pytest -c tests/governance/pytest.ini
          --confcutdir=tests/governance -p no:cacheprovider tests/governance

  eval-harness:
    name: LLM Eval Harness
    runs-on: ubuntu-latest
    # Enforcing since 2026-07-25 (harden-lint-and-type-gates): the observation
    # window closed with consecutive green runs, e.g. run 30156956859 on the
    # PR #93 merge commit (gate step green, ~6 s). The offline gate is
    # deterministic (stub LLM), so failures here are real contract regressions.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-eval-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-eval-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[eval]"

      - name: Probe eval-harness import (distinguishes deps-broke from gate-failed)
        run: python -c "import eval_harness; print('eval_harness importable')"

      - name: Run LLM eval gate
        run: make eval-llm

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [lint, test, cloud-tests, security]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-cov-${{ hashFiles('**/pyproject.toml', '**/requirements.txt', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-cov-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/unit/ tests/sanity/ tests/integration/ tests/cloud/unit/ \
            --cov=alpha_zero \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -m "not slow and not requires_env" \
            --ignore=tests/unit/test_distributed

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
