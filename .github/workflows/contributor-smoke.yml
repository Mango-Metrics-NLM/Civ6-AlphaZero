name: Contributor Smoke

# "Does a fresh contributor's `pip install -e .[dev]` still work on the three
# desktop platforms?" -- the install that README, CONTRIBUTING and CLAUDE.md
# all give, which the 2026-09-04 audit found aborting entirely on Debian/Ubuntu
# because of one optional sdist (G2).
#
# A separate workflow, deliberately. A `paths:` filter belongs on the trigger,
# and putting one on ci.yml would skip every real gate for a docs-only PR;
# putting a per-job `if:` path check inside ci.yml instead interacts badly with
# required status checks (a required job that is skipped reports no status and
# the PR cannot merge). Here the filter costs nothing: this workflow is
# advisory throughout (`continue-on-error: true` on the job) and must never be
# made a required check. It also runs weekly so a platform regression caused
# by an upstream wheel, not by a change here, is still noticed.
on:
  pull_request:
    paths:
      - pyproject.toml
      - "requirements*.txt"
      - .github/workflows/contributor-smoke.yml
  schedule:
    - cron: "37 4 * * 1" # Mondays 04:37 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Install + sanity (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # CLAUDE.md 5.1: without this cap torch's OpenMP spin-wait wedges two tests.
      OMP_NUM_THREADS: "2"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # tests/regression/test_coverage_floors_ratchet.py needs a merge base.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install the dev extra the way a contributor does
        run: |
          python -m pip install --upgrade pip
          # CPU torch first on every platform, so the Linux runner never pulls
          # the CUDA build and its ~2.6 GB of nvidia-*/triton wheels (see ci.yml).
          python -m pip install "torch>=2.0.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Import, sanity and regression suites
        run: pytest tests/sanity tests/regression -q
