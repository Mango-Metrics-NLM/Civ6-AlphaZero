name: Feature request
description: Propose a new capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? A substantive change will likely need an OpenSpec proposal under openspec/changes/.
    validations:
      required: true
  - type: checkboxes
    id: charter
    attributes:
      label: Charter check
      description: PROJECT_CHARTER.md defines scope and non-goals.
      options:
        - label: I have checked this is not a documented non-goal.
          required: false
