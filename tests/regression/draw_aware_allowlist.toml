# characters. Entries that no longer match an offender fail the stale check:
# delete the entry when the site is fixed. Entries marked CONFIRM-FIRST name
# distributed-coordination files (CLAUDE.md 3.2) whose proposed hunks live in
# the P7 worker report; apply the hunk, then delete the entry.

