[pytest]
# Standalone config for the governance validator tests so the CI `governance`
# job runs them without loading the repo-root pyproject `addopts`/`asyncio_mode`
# (which would require pytest-timeout / pytest-asyncio) or the torch-importing
# tests/conftest.py. Run with:
#   pytest -c tests/governance/pytest.ini --confcutdir=tests/governance tests/governance
addopts = -q
