<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Atari AlphaZero{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/atari.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Atari AlphaZero</div>
        <div class="nav-links">
            <a href="/play" class="nav-link {% if request.url.path == '/play' or request.url.path == '/' %}active{% endif %}">Play</a>
            <a href="/train" class="nav-link {% if request.url.path == '/train' %}active{% endif %}">Train</a>
            <a href="/evaluate" class="nav-link {% if request.url.path == '/evaluate' %}active{% endif %}">Evaluate</a>
            <a href="/replay" class="nav-link {% if request.url.path == '/replay' %}active{% endif %}">Replay</a>
        </div>
        <div class="nav-status">
            <span id="connection-status" class="status-dot disconnected"></span>
            <span id="game-name">{{ game }}</span>
        </div>
    </nav>
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
