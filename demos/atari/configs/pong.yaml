# Atari AlphaZero Demo — Pong configuration
# Usage: python -m demos.atari --config demos/atari/configs/pong.yaml

environment:
  game_name: Pong
  frame_height: 84
  frame_width: 84
  frame_stack: 4
  frame_skip: 4
  grayscale: true
  terminal_on_life_loss: true
  clip_rewards: true
  vector_dim: 32

network:
  num_res_blocks: 6
  num_filters: 64
  fc_hidden_dim: 256
  value_head_hidden: 128
  dropout: 0.0

mcts:
  num_simulations: 50
  c_puct: 1.5
  dirichlet_alpha: 0.25
  dirichlet_epsilon: 0.25
  temperature: 1.0
  temperature_threshold: 500

training:
  num_iterations: 100
  episodes_per_iteration: 10
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 1.0
  num_epochs: 5
  replay_buffer_size: 100000
  min_replay_size: 500
  discount_factor: 0.99
  checkpoint_dir: checkpoints/atari/pong
  log_dir: logs/atari/pong
  save_interval: 10
  eval_episodes: 5
  eval_interval: 10

hierarchical:
  enabled: false
  strategic_update_freq: 500
  tactical_update_freq: 50
