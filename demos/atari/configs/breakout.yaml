# Atari AlphaZero Demo — Breakout configuration
# Usage: python -m demos.atari --config demos/atari/configs/breakout.yaml

environment:
  game_name: Breakout
  frame_height: 84
  frame_width: 84
  frame_stack: 4
  frame_skip: 4
  grayscale: true
  terminal_on_life_loss: true
  clip_rewards: true
  vector_dim: 32

network:
  num_res_blocks: 6
  num_filters: 64
  fc_hidden_dim: 256
  value_head_hidden: 128

mcts:
  num_simulations: 50
  c_puct: 1.5
  dirichlet_alpha: 0.25
  dirichlet_epsilon: 0.25
  temperature: 1.0
  temperature_threshold: 500

training:
  num_iterations: 200
  episodes_per_iteration: 10
  batch_size: 128
  learning_rate: 0.001
  discount_factor: 0.99
  checkpoint_dir: checkpoints/atari/breakout
  log_dir: logs/atari/breakout

hierarchical:
  enabled: true
  strategic_update_freq: 500
  tactical_update_freq: 50
  goal_reward_shaping_weight: 0.1
