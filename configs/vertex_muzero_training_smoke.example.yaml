# EXAMPLE CONFIGURATION. Copy to configs/local/vertex_muzero_training_smoke.yaml (gitignored) and replace
# the YOUR_* placeholders with your own project, bucket and image before use.
# Vertex AI MuZero Training Smoke Test Configuration
#
# ISOLATED from running AlphaZero training via:
#   - --agent_id=muzero-smoke   (scopes GCS paths under muzero-smoke/)
#   - --algorithm=muzero        (uses MuZero multi-step training)
#   - Small network (2 res blocks, 32 filters) for fast validation
#   - Only 3 epochs
#
# GCS paths will be written to:
#   models/civ6az/muzero-smoke/v001/
#   checkpoints/civ6az/muzero-smoke/
#
# Usage:
#   1. Copy to configs/local/vertex_muzero_training_smoke.yaml for secrets
#   2. configs/local/ is gitignored

workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
    replicaCount: 1
    containerSpec:
      imageUri: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT/civ6az-muzero-world-model/civ6az-muzero:v16-full-fix
      args:
        - "--mode=training"
        - "--iteration=1"
        - "--trajectory_iterations=1"
        - "--epochs=3"
        - "--batch_size=64"
        - "--learning_rate=0.001"
        - "--board_size=6"
        - "--action_space_size=376"
        - "--num_res_blocks=2"
        - "--num_filters=32"
        - "--algorithm=muzero"
        - "--agent_id=muzero-smoke"
      env:
        - name: MLFLOW_EXPERIMENT_NAME
          value: "civ6az-muzero-world-model"
        - name: MLFLOW_ENABLED
          value: "true"
        - name: CIV6AZ_GCS_BUCKET
          value: "YOUR_BUCKET"
        - name: CIV6AZ_VERTEX_PROJECT
          value: "YOUR_GCP_PROJECT"
        - name: CIV6AZ_VERTEX_REGION
          value: "us-central1"
