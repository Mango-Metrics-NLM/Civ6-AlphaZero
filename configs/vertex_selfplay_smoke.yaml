# Vertex AI Self-Play Smoke Test Configuration
#
# Usage:
#   1. Copy this template to vertex_selfplay_smoke_local.yaml
#   2. Optionally set MLFLOW_TRACKING_URI via one of:
#      a) Google Secret Manager (recommended for production)
#      b) Environment variable in your local copy
#   3. The *_local.yaml files are gitignored and safe for real keys
#
# For Secret Manager integration, replace the MLFLOW_TRACKING_URI env block with:
#   - name: MLFLOW_TRACKING_URI
#     valueFrom:
#       secretKeyRef:
#         name: 'wandb-api-key'    # Secret Manager secret name
#         key: 'latest'            # Secret version

workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
    replicaCount: 1
    containerSpec:
      imageUri: us-central1-docker.pkg.dev/hrmtrain/civ6az-muzero-world-model/civ6az-muzero:v16-full-fix
      args:
        - "--mode=selfplay"
        - "--worker_id=0"
        - "--model_version=0"
        - "--iteration=1"
        - "--games=10"
        - "--mcts_simulations=8"
        - "--board_size=6"
        - "--max_turns=150"
        - "--num_res_blocks=2"
        - "--num_filters=32"
      env:
        # MLFLOW_TRACKING_URI: point at your MLflow server (or omit for file store).
        # DO NOT commit real keys here. See header for setup instructions.
        - name: MLFLOW_EXPERIMENT_NAME
          value: "civ6az-muzero-world-model"
        - name: MLFLOW_ENABLED
          value: "true"
        - name: CIV6AZ_GCS_BUCKET
          value: "civ6az-muzero-training"
        - name: CIV6AZ_VERTEX_PROJECT
          value: "hrmtrain"
        - name: CIV6AZ_VERTEX_REGION
          value: "us-central1"
