# Run card: A1 -- the registered A1 protocol, docs/EVALUATION.md section 7.1.
#
#   python scripts/run_card.py configs/run_cards/a1.yaml --price_only   # prints 980
#
# DO NOT RUN until all three hold:
#   1. `sha` is the merged commit that carries this registration. The all-zero
#      placeholder below cannot be pinned, so a run fails closed at the pin -- but
#      it still claims E:\civ6az-data\runs\a1-20261111, and a run directory is single-use;
#   2. T0b has filled in section 7.1's measured positive-control reference and the
#      branch in force (40 or 60 games); for "60", swap in section 7.1's two
#      branch commands;
#   3. no MCTS_* variable is set in the environment (section 7.1: VOID otherwise).
#
# Every argv below is a section 7.1 command with <D> = E:\civ6az-data\runs\a1-20261111.
# tests/scripts/test_a1_registration.py holds the two together token for token.
card_id: a1-20261111
sha: '0000000000000000000000000000000000000000'
max_games: 980
description: A1 learning run at seed 20261111 (LF-A1), registered in docs/EVALUATION.md section 7.1.
