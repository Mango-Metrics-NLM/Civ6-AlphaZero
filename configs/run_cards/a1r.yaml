  - name: train
    runner: training_civ6
    argv:
      - '--seed'
      - '20261112'
      - '--board_size'
      - '8'
      - '--max_turns'
      - '60'
      - '--num_iterations'
      - '20'
      - '--num_games'
      - '24'
      - '--mcts'
      - 'gumbel'
      - '--gumbel_k'
      - '8'
      - '--gumbel_sims'
      - '24'
      - '--device'
