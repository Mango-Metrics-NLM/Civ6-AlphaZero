# Run card: A1-R (replication) -- the registered A1 protocol, docs/EVALUATION.md section 7.1.
#
#   python scripts/run_card.py configs/run_cards/a1r.yaml --price_only   # prints 980
#
# DO NOT RUN until all four hold:
#   1. `sha` is the merged commit that carries this registration (with the digest
#      in section 7.1's registration log). The all-zero placeholder below is
#      refused by run_card after pricing and before anything is created, so the
#      single-use run directory E:\civ6az-data\runs\a1r-20261112 is not claimed;
#   2. T0b has filled in section 7.1's measured positive-control reference and the
#      branch in force (40 or 60 games); for "60", swap in section 7.1's two
#      branch commands;
#   3. no MCTS_* variable is set in the environment (section 7.1: VOID otherwise;
#      run_card refuses to start);
#   4. the data root is E:\civ6az-data (--data_root or CIV6AZ_DATA_ROOT), so that
#      run.json lands in <D> beside the run's outputs.
#
# Set `sha` to the rc LOCALLY and do not commit that edit on the release line:
# after an rc only docs/evidence/** may change before the final tag.
# A re-run after a VOID needs a new card_id AND every <D> path below rewritten to
# E:\civ6az-data\runs\<new card_id> (13 paths); keep the VOID attempt for the bundle
# (docs/runbooks/branching-and-release.md section 4, 'Before every card').
#
# Every argv below is a section 7.1 command with <D> = E:\civ6az-data\runs\a1r-20261112
# and every --seed 20261111 replaced by --seed 20261112.
# tests/scripts/test_a1_registration.py holds the two together token for token.
card_id: a1r-20261112
sha: '0000000000000000000000000000000000000000'
max_games: 980
description: A1-R (replication) learning run at seed 20261112 (LF-A1), registered in docs/EVALUATION.md section 7.1.
