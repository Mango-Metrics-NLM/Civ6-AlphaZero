# Vertex AI MuZero Orchestrator Smoke Test Configuration
#
# This config is for the LOCAL orchestrator that dispatches workers to Vertex AI.
# The orchestrator runs on your machine; only workers run in containers.
#
# ISOLATED from running AlphaZero training via:
#   - --algorithm=muzero             (uses MuZero throughout pipeline)
#   - --agent_id=muzero-smoke        (scopes all GCS paths)
#   - 1 iteration, 1 worker, 2 games (minimal resource usage)
#
# DRY RUN (no cloud costs):
#   python -m alpha_zero.cloud.gcp.vertex_orchestrator \
#       --algorithm=muzero \
#       --iterations=1 \
#       --workers=1 \
#       --games_per_worker=2 \
#       --epochs=2 \
#       --mcts_simulations=8 \
#       --num_res_blocks=2 \
#       --num_filters=32 \
#       --agent_id=muzero-smoke \
#       --dry_run
#
# LIVE RUN (uses Vertex AI, costs ~$1-2):
#   . ./scripts/setup_env.ps1   # Load env vars
#   python -m alpha_zero.cloud.gcp.vertex_orchestrator \
#       --algorithm=muzero \
#       --iterations=1 \
#       --workers=1 \
#       --games_per_worker=2 \
#       --epochs=2 \
#       --mcts_simulations=8 \
#       --num_res_blocks=2 \
#       --num_filters=32 \
#       --agent_id=muzero-smoke
#
# IMPORTANT: The orchestrator runs LOCALLY. Do NOT submit it as a Vertex AI job.
