# EXAMPLE CONFIGURATION. Copy to configs/local/cloud_training_v1.yaml (gitignored) and replace
# the YOUR_* placeholders with your own project, bucket and image before use.
# =============================================================================
# Cloud Training V1 — First Multi-Iteration Config for Vertex AI
# =============================================================================
# Launches a real training pipeline on GCP with GumbelMCTS for speed.
#
# Usage (via orchestrator CLI):
#   python -m alpha_zero.cloud.gcp.vertex_orchestrator \
#       --iterations=20 --workers=4 --games_per_worker=25 \
#       --mcts_type=gumbel --mcts_simulations=16 \
#       --evaluation_games=10 --wandb
#
# Or use the convenience wrapper:
#   bash scripts/run_cloud_training.sh
#
# Prerequisites:
#   - MLFLOW_ENABLED=true set (optional, for experiment tracking)
#   - gcloud auth configured with YOUR_GCP_PROJECT project
#   - Docker image pushed: gcr.io/YOUR_GCP_PROJECT/civ6az-muzero:latest

# --- Pipeline ---
pipeline:
  iterations: 20
  start_iteration: 0

# --- Self-Play ---
selfplay:
  workers: 4
  games_per_worker: 25               # 100 games total per iteration
  max_turns: 30                       # Keeps games fast (~4 games/min w/ Gumbel)
  mcts_type: gumbel
  mcts_simulations: 16
  gumbel_num_actions: 8
  # Vectorized (batched) self-play is opt-in and requires BOTH settings:
  # mcts_type must be batch_gumbel and num_parallel_games must exceed 1.
  # With any other mcts_type the worker ignores num_parallel_games and runs
  # sequential self-play (it logs a warning when it does).
  num_parallel_games: 1               # >1 requires mcts_type: batch_gumbel
  max_batch_size: 64                  # Inference batch ceiling when vectorized

# --- Network ---
network:
  board_size: 8
  action_space_size: 376              # MicroCiv: 1 + 20*8 + 20*8 + 20 + 20 + 5*3
  num_res_blocks: 6
  num_filters: 64

# --- Training ---
training:
  epochs: 10
  batch_size: 128
  learning_rate: 0.001

# --- Evaluation ---
evaluation:
  # PROMOTION GATE: the shipped defaults cannot promote. With the ~73.5% draw
  # rate measured at this configuration, the default legacy_win_rate policy has
  # a ceiling of 1 - draw_rate = 0.265 against a 0.55 threshold, and 0.55 read
  # as a *score* rate demands ~+35 Elo from one iteration. See
  # docs/runbooks/promotion-gate.md for the arithmetic and the recommended
  # CIV6AZ_PROMOTION_POLICY / CIV6AZ_PROMOTION_THRESHOLD settings.
  games: 10                           # Arena: new model vs previous
  # Win-rate threshold for model acceptance handled by orchestrator default (0.55)

# --- Curriculum ---
curriculum:
  enabled: false                      # Enable in v2 once base model improves

# --- Reward Shaping ---
reward_shaping:
  enabled: false                      # Enable in v2

# --- W&B ---
wandb:
  enabled: true
  project: civ6az-muzero-world-model
  tags:
    - cloud-v1
    - gumbel
    - 8x8

# --- Infrastructure ---
infrastructure:
  gpu_type: NVIDIA_TESLA_T4           # T4 for both selfplay and training (L4 quota exceeded)
  max_retries: 2
