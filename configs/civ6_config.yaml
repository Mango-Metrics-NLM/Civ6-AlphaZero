# Civ6 AlphaZero Configuration

environment:
  type: microciv  # microciv, unciv, or civ6
  board_size: 16
  num_players: 2
  max_turns: 200

network:
  spatial_channels: 84
  vector_dim: 512
  num_res_blocks: 10
  num_filters: 128
  num_heads: 4
  value_head_hidden: 256
  dropout: 0.0

mcts:
  num_simulations: 200
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  temperature: 1.0
  temperature_threshold: 30

training:
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_decay_steps: [100000, 300000, 500000]
  lr_decay_rate: 0.1
  replay_buffer_size: 500000
  min_replay_size: 10000
  gradient_clip: 1.0

selfplay:
  num_actors: 64
  games_per_checkpoint: 500
  save_interval: 100

rewards:
  win: 1.0
  loss: -1.0
  draw: 0.0
  city_founded: 0.1
  tech_researched: 0.05
  unit_killed: 0.02
  unit_lost: -0.02
  wonder_built: 0.15

# Distributed training settings for Phase 2
distributed:
  enabled: true
  num_actors: 64
  actor_batch_size: 8  # Games per actor before syncing
  learner_batch_size: 256
  weight_sync_interval: 100  # Learner steps before publishing weights
  max_queue_size: 10000
  compression_enabled: true
  evaluation_interval: 1000  # Steps between evaluations
  checkpoint_interval: 5000
  max_training_steps: 1000000

# Unciv interface settings
unciv:
  save_dir: "saves/unciv"
  auto_save: true
  auto_save_interval: 10  # Turns
  board_size: 80  # Unciv maps are typically larger
  max_players: 8

# Logging and debugging
logging:
  level: "INFO"
  log_dir: "logs"
  game_logging: true
  training_metrics: true
  metrics_window: 100  # Rolling window for metrics
  tensorboard: false
  profile_enabled: false

# MicroCiv-specific settings for Phase 1
microciv:
  board_size: 16
  num_res_blocks: 6
  num_filters: 64
  num_simulations: 50
  batch_size: 128

# Hierarchical action space settings
action_space:
  hierarchical: true
  max_units: 100
  max_cities: 20
  num_directions: 8
  tech_count: 73
  civic_count: 56
