workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
    replicaCount: 1
    containerSpec:
      imageUri: us-central1-docker.pkg.dev/hrmtrain/vertex-ai-training/hrm-training:v11-smoke
      args:
        - "--mode=training"
        - "--iteration=1"
        - "--trajectory_iterations=1"
        - "--epochs=5"
        - "--batch_size=128"
        - "--learning_rate=0.001"
        - "--board_size=6"
        - "--action_space_size=376"
        - "--num_res_blocks=2"
        - "--num_filters=32"
      env:
        - name: WANDB_API_KEY
          value: "YOUR_WANDB_API_KEY_HERE"
        - name: WANDB_PROJECT
          value: "civ6-alphazero"
        - name: WANDB_ENABLED
          value: "true"
        - name: CIV6AZ_GCS_BUCKET
          value: "civ6az-training"
        - name: CIV6AZ_VERTEX_PROJECT
          value: "hrmtrain"
        - name: CIV6AZ_VERTEX_REGION
          value: "us-central1"
