# EXAMPLE CONFIGURATION. Copy to configs/local/vertex_orchestrator_smoke.yaml (gitignored) and replace
# the YOUR_* placeholders with your own project, bucket and image before use.
# Vertex AI Orchestrator Smoke Test Configuration
#
# Usage:
#   python -m alpha_zero.cloud.gcp.vertex_orchestrator \
#       --iterations=2 \
#       --workers=2 \
#       --games_per_worker=2 \
#       --epochs=2 \
#       --dry_run
#
# For real run:
#   1. Set MLFLOW_TRACKING_URI env var
#   2. Remove --dry_run
#   3. Ensure ./configs/gcp_config.yaml is valid

workerPoolSpecs:
  # Orchestrator runs locally or on a small VM to manage other jobs
  # This config file is primarily for documenting the args, as the orchestrator
  # parses CLI args directly.
  - machineSpec:
      machineType: n1-standard-4
    replicaCount: 1
    containerSpec:
      imageUri: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT/civ6az-muzero-world-model/civ6az-muzero:v16-full-fix
      args:
        - "--iterations=2"
        - "--workers=2"
        - "--games_per_worker=2"
        - "--epochs=2"
        - "--mcts_type=gumbel"
        - "--mcts_simulations=10"  # Low sims for smoke test
