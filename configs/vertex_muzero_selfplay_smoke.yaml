# Vertex AI MuZero Self-Play Smoke Test Configuration
#
# ISOLATED from running AlphaZero training via:
#   - --agent_id=muzero-smoke   (scopes GCS paths under muzero-smoke/)
#   - --mcts_type=muzero        (uses MuZero MCTS with dynamics model)
#   - Small network (2 res blocks, 32 filters) for fast validation
#   - Only 5 games with 8 MCTS sims
#
# GCS paths will be written to:
#   models/civ6az/muzero-smoke/v000/
#   trajectories/civ6az/muzero-smoke/iter_001/
#
# Usage:
#   1. Copy to vertex_muzero_selfplay_smoke_local.yaml for secrets
#   2. The *_local.yaml files are gitignored

workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
    replicaCount: 1
    containerSpec:
      imageUri: us-central1-docker.pkg.dev/hrmtrain/civ6az-muzero-world-model/civ6az-muzero:v16-full-fix
      args:
        - "--mode=selfplay"
        - "--worker_id=0"
        - "--model_version=0"
        - "--iteration=1"
        - "--games=5"
        - "--mcts_simulations=8"
        - "--board_size=6"
        - "--max_turns=50"
        - "--num_res_blocks=2"
        - "--num_filters=32"
        - "--mcts_type=muzero"
        - "--agent_id=muzero-smoke"
      env:
        - name: MLFLOW_EXPERIMENT_NAME
          value: "civ6az-muzero-world-model"
        - name: MLFLOW_ENABLED
          value: "true"
        - name: CIV6AZ_GCS_BUCKET
          value: "civ6az-muzero-training"
        - name: CIV6AZ_VERTEX_PROJECT
          value: "hrmtrain"
        - name: CIV6AZ_VERTEX_REGION
          value: "us-central1"
