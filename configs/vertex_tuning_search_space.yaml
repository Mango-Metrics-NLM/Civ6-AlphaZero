studySpec:
  metrics:
  - metricId: loss
    goal: MINIMIZE
  parameters:
  - parameterId: learning_rate
    scaleType: UNIT_LOG_SCALE
    doubleValueSpec:
      minValue: 0.0001
      maxValue: 0.01
  - parameterId: batch_size
    discreteValueSpec:
      values:
      - 64
      - 128
      - 256
      - 512
  - parameterId: weight_decay
    scaleType: UNIT_LINEAR_SCALE
    doubleValueSpec:
      minValue: 0.00001
      maxValue: 0.001
  - parameterId: num_res_blocks
    integerValueSpec:
      minValue: 4
      maxValue: 10
  - parameterId: num_filters
    discreteValueSpec:
      values:
      - 32
      - 64
      - 128
algorithm: ALGORITHM_UNSPECIFIED # Vertex AI Vizier default (Bayesian Optimization)
trialJobSpec:
  workerPoolSpecs:
    - machineSpec:
        machineType: n1-standard-4
        acceleratorType: NVIDIA_TESLA_T4
        acceleratorCount: 1
      replicaCount: 1
      containerSpec:
        imageUri: us-central1-docker.pkg.dev/hrmtrain/civ6az-muzero-world-model/civ6az-muzero:v16-full-fix
