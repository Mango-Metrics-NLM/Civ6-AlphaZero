[package]
name = "civ6-alphazero-module"
version = "0.1.0"
edition = "2021"
description = "SpacetimeDB module for Civ6 AlphaZero distributed training coordination"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[profile.release]
opt-level = "s"
lto = true
