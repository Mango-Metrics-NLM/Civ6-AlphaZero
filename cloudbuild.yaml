substitutions:
  _TAG_NAME: v1.6.0
  _IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/civ6az/alphazero-training

steps:
- name: 'python:3.12-slim'
  id: lint
  entrypoint: bash
  args:
  - -c
  - |
    pip install --quiet ruff==0.15.8 && \
    ruff check alpha_zero/ --select E,F --ignore E501 --exit-non-zero-on-fix

- name: 'gcr.io/cloud-builders/docker'
  id: build
  args:
  - build
  - -t
  - ${_IMAGE}:${_TAG_NAME}
  - -f
  - dockerfiles/Dockerfile.vertex
  - .
  waitFor:
  - lint

# Runs INSIDE the image just built. The image uses PYTHONPATH rather than
# `pip install -e .`, so `requires-python = ">=3.11"` is never enforced at build
# time; this step is where it is. The base (nvcr.io/nvidia/pytorch:26.10-py3) ships
# Python 3.12. A base below 3.11 fails the build here, with the version in the log,
# instead of as a SyntaxError in the first worker that hits a 3.11-only construct.
- name: '${_IMAGE}:${_TAG_NAME}'
  id: check-python-version
  entrypoint: python
  args:
  - -c
  - 'import sys; print("python", sys.version); sys.version_info >= (3, 11) or sys.exit("image Python is below requires-python >=3.11")'
  waitFor:
  - build

- name: '${_IMAGE}:${_TAG_NAME}'
  id: smoke-test
  entrypoint: python
  dir: /app
  args:
  - -c
  - import sys; sys.path.insert(0, "/app"); from alpha_zero.cloud.gcp.config import GCPConfig; print("Container smoke test passed")
  waitFor:
  - check-python-version

- name: '${_IMAGE}:${_TAG_NAME}'
  id: test-selfplay
  entrypoint: python
  dir: /app
  env:
  - 'MLFLOW_TRACKING_URI=file:/workspace/mlruns'
  - 'MLFLOW_EXPERIMENT_NAME=ci-smoke'
  - 'MLFLOW_ENABLED=true'
  args:
  - -m
  - alpha_zero.cloud.gcp.selfplay_worker
  - --dry_run
  - --worker_id=0
  - --model_version=1
  - --iteration=1
  - --games=1
  waitFor:
  - smoke-test

- name: '${_IMAGE}:${_TAG_NAME}'
  id: test-training
  entrypoint: python
  dir: /app
  env:
  - 'MLFLOW_TRACKING_URI=file:/workspace/mlruns'
  - 'MLFLOW_EXPERIMENT_NAME=ci-smoke'
  - 'MLFLOW_ENABLED=true'
  args:
  - -m
  - alpha_zero.cloud.gcp.training_worker
  - --dry_run
  - --iteration=1
  - --trajectory_iterations=1
  - --epochs=1
  waitFor:
  - smoke-test

- name: '${_IMAGE}:${_TAG_NAME}'
  id: test-muzero-selfplay
  entrypoint: python
  dir: /app
  env:
  - 'MLFLOW_TRACKING_URI=file:/workspace/mlruns'
  - 'MLFLOW_EXPERIMENT_NAME=ci-smoke'
  - 'MLFLOW_ENABLED=true'
  args:
  - -m
  - alpha_zero.cloud.gcp.selfplay_worker
  - --dry_run
  - --worker_id=0
  - --model_version=1
  - --iteration=1
  - --games=1
  - --mcts_type=muzero
  waitFor:
  - smoke-test

- name: '${_IMAGE}:${_TAG_NAME}'
  id: test-orchestrator-guard
  entrypoint: bash
  dir: /app
  args:
  - -c
  - |
    python -m alpha_zero.cloud.gcp.entrypoint --mode=orchestrator 2>&1
    EXIT_CODE=$$?
    if [ $$EXIT_CODE -eq 1 ]; then
      echo "PASS: orchestrator mode correctly blocked"
    else
      echo "FAIL: orchestrator mode should return 1 but got $$EXIT_CODE"
      exit 1
    fi
  waitFor:
  - smoke-test

- name: '${_IMAGE}:${_TAG_NAME}'
  id: test-evaluation
  entrypoint: python
  dir: /app
  env:
  - 'MLFLOW_TRACKING_URI=file:/workspace/mlruns'
  - 'MLFLOW_EXPERIMENT_NAME=ci-smoke'
  - 'MLFLOW_ENABLED=true'
  args:
  - -m
  - alpha_zero.cloud.gcp.evaluation_worker
  - --mode=evaluation
  - --dry_run
  - --model_version_new=1
  - --model_version_old=0
  - --iteration=0
  - --games=2
  - --mcts_type=gumbel
  - --mcts_simulations=2
  - --max_turns=5
  - --board_size=8
  - --action_space_size=376
  waitFor:
  - test-training

- name: 'gcr.io/cloud-builders/docker'
  id: push
  args:
  - push
  - ${_IMAGE}:${_TAG_NAME}
  waitFor:
  - test-selfplay
  - test-training
  - test-muzero-selfplay
  - test-orchestrator-guard
  - test-evaluation

images:
- ${_IMAGE}:${_TAG_NAME}


tags:
- civ6az
- training
- vertex-ai

options:
  # _IMAGE embeds $PROJECT_ID; a manual `gcloud builds submit` expands that
  # nested reference only with dynamic substitutions on (triggers always do).
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
