[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --tb=short

markers =
    unit: Unit tests focusing on isolated components
    integration: Integration tests testing interaction between components
    functional: Functional system tests
    e2e: End-to-end game loop and orchestrator tests
    user_journey: Complete user journey tests for gameplay workflows
    security: Security and input sanitization validation tests
    sanity: Quick sanity checks for build verification
    cloud: Cloud training and GCP integration tests
    slow: Tests that take a long time to run
