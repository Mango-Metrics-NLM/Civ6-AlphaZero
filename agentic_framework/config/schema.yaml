# Agentic Framework Configuration Schema
# All values are configurable - no hardcoded defaults in code

version: "1.0"

# Objective Function Configuration
objective:
  system_intent:
    type: string
    required: true
    description: "One-sentence description of what is being built"

  success_criteria:
    type: list
    required: true
    item_schema:
      criterion:
        type: string
        required: true
      verifiable:
        type: boolean
        default: true
      verification_command:
        type: string
        required: false

  problem_description:
    type: object
    properties:
      problem_statement:
        type: string
        required: true
      data_flows:
        type: string
        required: true
      failure_modes:
        type: string
        required: true

# Constraint Configuration
constraints:
  hard:
    type: list
    description: "Violations result in failure"
    item_schema:
      name:
        type: string
        required: true
      type:
        type: enum
        values: [language, dependency, security, compatibility]
      value:
        type: string
        required: true
      validation_command:
        type: string
        required: false

  soft:
    type: list
    description: "Preferences that can be relaxed"
    item_schema:
      name:
        type: string
        required: true
      type:
        type: enum
        values: [style, architecture, performance, testing]
      value:
        type: string
        required: true
      priority:
        type: integer
        range: [1, 10]
        default: 5

  anti:
    type: list
    description: "Explicit permissions"
    item_schema:
      permission:
        type: string
        required: true
      scope:
        type: string
        required: false

# Permission Architecture
permissions:
  scope:
    in_scope:
      type: list
      item_type: string
      description: "Glob patterns for files in scope"
    out_of_scope:
      type: list
      item_type: string
      description: "Glob patterns for files out of scope"

  autonomy:
    autonomous:
      type: list
      item_type: string
      description: "Actions that can proceed without confirmation"
    confirm_first:
      type: list
      item_type: string
      description: "Actions requiring confirmation"
    prohibited:
      type: list
      item_type: string
      description: "Actions that must never be attempted"

  resource_budget:
    max_iterations:
      type: integer
      default: 5
      description: "Max iterations before requesting guidance"
    max_files_per_pass:
      type: integer
      default: 20
      description: "Max files to modify in single pass"
    exploration_timeout_seconds:
      type: integer
      default: 600
      description: "Time limit for research before asking"

# Feedback Loop Configuration
feedback:
  verification_commands:
    type: list
    ordered: true
    item_schema:
      name:
        type: string
        required: true
      command:
        type: string
        required: true
      timeout_seconds:
        type: integer
        default: 300
      fail_fast:
        type: boolean
        default: false
      retry_count:
        type: integer
        default: 0

  error_handling:
    type: object
    properties:
      auto_fix_patterns:
        type: list
        item_schema:
          error_type:
            type: string
          action:
            type: enum
            values: [auto_fix, analyze_fix, report, escalate]
          max_retries:
            type: integer
            default: 3

  success_verification:
    type: list
    item_schema:
      check:
        type: string
        required: true
      command:
        type: string
        required: false

# Session Memory Configuration
session:
  memory_file:
    type: string
    default: "CLAUDE.md"

  sections:
    type: list
    item_schema:
      name:
        type: string
        required: true
      persist:
        type: boolean
        default: true
      format:
        type: enum
        values: [markdown_list, markdown_table, code_block, text]

# Execution Protocol
execution:
  initial_actions:
    type: list
    ordered: true
    item_schema:
      action:
        type: string
        required: true
      command:
        type: string
        required: false
      required:
        type: boolean
        default: true

  implementation_order:
    type: list
    ordered: true
    item_schema:
      phase:
        type: string
        required: true
      description:
        type: string
        required: false
      agent:
        type: string
        required: false

  completion_checklist:
    type: list
    item_schema:
      item:
        type: string
        required: true
      verification:
        type: string
        required: false

# Logging Configuration
logging:
  level:
    type: enum
    values: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
    default: INFO

  format:
    type: string
    default: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  handlers:
    type: list
    item_schema:
      type:
        type: enum
        values: [console, file, rotating_file, json]
      level:
        type: enum
        values: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
      destination:
        type: string
        required: false
