# Agentic Framework Default Configuration
# Override these values in your project-specific config.yaml

version: "1.0"

# Objective Function - Must be provided by user
objective:
  system_intent: ""  # Required: override in project config
  success_criteria: []  # Required: override in project config
  problem_description:
    problem_statement: ""
    data_flows: ""
    failure_modes: ""

# Default Constraints
constraints:
  hard:
    - name: "python_version"
      type: "language"
      value: ">=3.10"
      validation_command: "python --version"

    - name: "no_hardcoded_secrets"
      type: "security"
      value: "No API keys, passwords, or tokens in source"
      validation_command: "grep -rn 'password\\|api_key\\|secret\\|token' --include='*.py' || true"

    - name: "input_validation"
      type: "security"
      value: "All external inputs must be validated"

  soft:
    - name: "type_hints"
      type: "style"
      value: "Use type hints on all function signatures"
      priority: 8

    - name: "docstrings"
      type: "style"
      value: "Public functions should have docstrings"
      priority: 6

    - name: "test_coverage"
      type: "testing"
      value: "Maintain >80% coverage on core logic"
      priority: 9

    - name: "async_io"
      type: "performance"
      value: "Prefer async I/O for blocking operations"
      priority: 7

  anti:
    - permission: "Restructure existing file organization"
      scope: "within project boundaries"

    - permission: "Add dependencies not explicitly listed"
      scope: "standard libraries and well-maintained packages"

    - permission: "Refactor adjacent code for consistency"
      scope: "within touched modules"

    - permission: "Choose implementation patterns not specified"
      scope: "when multiple valid approaches exist"

# Default Permissions
permissions:
  scope:
    in_scope:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "config/**/*.yaml"
      - "*.py"
      - "*.yaml"
      - "*.md"

    out_of_scope:
      - "vendor/**"
      - "third_party/**"
      - ".git/**"
      - "*.lock"
      - "**/__pycache__/**"

  autonomy:
    autonomous:
      - "file_creation_in_scope"
      - "file_deletion_in_scope"
      - "dependency_installation"
      - "running_tests"
      - "linting_and_formatting"
      - "refactoring_for_consistency"
      - "adding_type_hints"
      - "adding_docstrings"

    confirm_first:
      - "architectural_changes_multi_module"
      - "breaking_api_changes"
      - "large_deletions_over_100_lines"
      - "schema_migrations"
      - "external_service_integration"

    prohibited:
      - "commits_to_main_branch"
      - "external_api_calls_with_side_effects"
      - "modifications_outside_scope"
      - "disabling_security_features"
      - "removing_tests_without_replacement"

  resource_budget:
    max_iterations: 5
    max_files_per_pass: 20
    exploration_timeout_seconds: 600

# Default Feedback Loop
feedback:
  verification_commands:
    - name: "lint"
      command: "ruff check ."
      timeout_seconds: 60
      fail_fast: false
      retry_count: 0

    - name: "type_check"
      command: "mypy . --ignore-missing-imports"
      timeout_seconds: 120
      fail_fast: false
      retry_count: 0

    - name: "unit_tests"
      command: "pytest tests/unit -v"
      timeout_seconds: 300
      fail_fast: false
      retry_count: 1

    - name: "integration_tests"
      command: "pytest tests/integration -v"
      timeout_seconds: 600
      fail_fast: false
      retry_count: 1

  error_handling:
    auto_fix_patterns:
      - error_type: "lint_error"
        action: "auto_fix"
        max_retries: 3

      - error_type: "type_error"
        action: "analyze_fix"
        max_retries: 3

      - error_type: "test_failure"
        action: "analyze_fix"
        max_retries: 3

      - error_type: "import_error"
        action: "analyze_fix"
        max_retries: 2

      - error_type: "repeated_failure"
        action: "escalate"
        max_retries: 0

  success_verification:
    - check: "all_verification_commands_pass"
      command: null

    - check: "smoke_test"
      command: null  # Override in project config

    - check: "generate_change_summary"
      command: null

# Session Memory Configuration
session:
  memory_file: "CLAUDE.md"

  sections:
    - name: "Build Commands"
      persist: true
      format: "markdown_list"

    - name: "Test Commands"
      persist: true
      format: "markdown_list"

    - name: "Architecture Decisions"
      persist: true
      format: "markdown_table"

    - name: "Known Issues"
      persist: true
      format: "markdown_list"

    - name: "Environment Setup"
      persist: true
      format: "markdown_list"

    - name: "Gotchas"
      persist: true
      format: "markdown_list"

# Execution Protocol
execution:
  initial_actions:
    - action: "read_session_memory"
      command: null
      required: false

    - action: "scan_project_structure"
      command: "find . -type f -name '*.py' | head -50"
      required: true

    - action: "identify_entry_points"
      command: null
      required: true

    - action: "run_baseline_tests"
      command: null
      required: false

  implementation_order:
    - phase: "understand"
      description: "Read existing patterns before writing"
      agent: "planning"

    - phase: "implement_core"
      description: "Smallest working version first"
      agent: "implementation"

    - phase: "add_error_handling"
      description: "Handle edge cases and failures"
      agent: "implementation"

    - phase: "write_tests"
      description: "Unit and integration tests"
      agent: "testing"

    - phase: "verify"
      description: "Run verification loop"
      agent: "verification"

    - phase: "refactor"
      description: "Clean up if needed"
      agent: "implementation"

    - phase: "document"
      description: "Update session memory"
      agent: "documentation"

  completion_checklist:
    - item: "All success criteria met"
      verification: "check_success_criteria"

    - item: "All verification commands pass"
      verification: "run_all_verifications"

    - item: "Session memory updated"
      verification: "check_memory_updated"

    - item: "Change summary provided"
      verification: "generate_summary"

    - item: "Known limitations documented"
      verification: "check_limitations_documented"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(message)s"

  handlers:
    - type: "console"
      level: "INFO"

    - type: "rotating_file"
      level: "DEBUG"
      destination: "logs/agentic_framework.log"

    - type: "json"
      level: "INFO"
      destination: "logs/agentic_framework.json"

# Agent-specific Configuration
agents:
  planning:
    timeout_seconds: 300
    max_context_files: 50

  implementation:
    timeout_seconds: 600
    max_lines_per_file: 500
    prefer_small_changes: true

  testing:
    timeout_seconds: 600
    coverage_threshold: 80
    test_frameworks: ["pytest"]

  verification:
    timeout_seconds: 300
    strict_mode: false

  documentation:
    timeout_seconds: 120
    auto_update_memory: true
