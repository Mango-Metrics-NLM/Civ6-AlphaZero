# Agentic Coding System Prompt Template
# Dynamic configuration with no hardcoded values - all settings are configurable
#
# Design Principle: This template treats prompting as constraint programming,
# not instruction writing. Define the feasible region, objective function,
# and search parameters—then let the agent solve.
#
# Usage:
#   from agentic_framework.templates import TemplateGenerator, create_template_generator
#   generator = create_template_generator()
#   output = generator.generate("agentic_prompt_template", **variables)

version: "${version:1.0}"

# =============================================================================
# SECTION 1: OBJECTIVE FUNCTION
# =============================================================================
objective:
  # 1.1 System Intent - What you're building in one sentence
  system_intent: "${system_intent}"

  # 1.2 Success Criteria - Mechanically verifiable conditions
  success_criteria:
    # Each criterion must be verifiable (not subjective)
    # Example: "All tests pass" not "Works correctly"
{%for criterion in success_criteria%}
    - criterion: "${criterion}"
      verifiable: true
{%endfor%}

  # 1.3 Problem Description - The "Three Paragraphs"
  problem_description:
    # Paragraph 1: Core problem and coordination logic
    problem_statement: "${problem_statement:}"

    # Paragraph 2: Data flows and state synchronization
    data_flows: "${data_flows:}"

    # Paragraph 3: Failure modes and invariants
    failure_modes: "${failure_modes:}"

# =============================================================================
# SECTION 2: FEASIBLE REGION (Constraints)
# =============================================================================
constraints:
  # 2.1 Hard Constraints - Violations cause failure
  hard:
    - name: "language_runtime"
      type: "requirement"
      value: "${language_runtime:Python 3.10+}"
      description: "Required language and runtime version"

    - name: "required_dependencies"
      type: "requirement"
      value: "${required_dependencies:[]}"
      description: "Dependencies that must be used"

    - name: "security"
      type: "security"
      rules:
        - "No hardcoded secrets"
        - "All inputs validated"
        - "OWASP Top 10 compliance"

    - name: "compatibility"
      type: "compatibility"
      value: "${compatibility_requirements:[]}"

{%for constraint in hard_constraints%}
    - name: "${constraint.name}"
      type: "${constraint.type:general}"
      value: "${constraint.value:}"
{%endfor%}

  # 2.2 Soft Constraints - Preferences (violations generate warnings)
  soft:
    - name: "style_guide"
      type: "style"
      value: "${style_guide:Google Style Guide}"
      priority: 5

    - name: "architecture"
      type: "architecture"
      value: "${architecture_preference:Prefer composition over inheritance}"
      priority: 3

    - name: "performance"
      type: "performance"
      value: "${performance_preference:Prefer async I/O, minimize allocations}"
      priority: 4

    - name: "testing"
      type: "testing"
      value: "${testing_preference:pytest, >80% coverage on core logic}"
      priority: 5

{%for constraint in soft_constraints%}
    - name: "${constraint.name}"
      type: "${constraint.type:general}"
      value: "${constraint.value:}"
      priority: ${constraint.priority:5}
{%endfor%}

  # 2.3 Anti-Constraints - Explicit permissions (what IS allowed)
  anti:
    - permission: "Restructure existing file organization"
      scope: "${restructure_scope:in_scope paths}"

    - permission: "Add dependencies not explicitly listed"
      scope: "${dependency_scope:production and dev}"

    - permission: "Refactor adjacent code for consistency"
      scope: "${refactor_scope:within scope boundaries}"

    - permission: "Choose implementation patterns not specified"
      scope: "${pattern_scope:all files in scope}"

{%for permission in anti_constraints%}
    - permission: "${permission.description}"
      scope: "${permission.scope:}"
{%endfor%}

# =============================================================================
# SECTION 3: PERMISSION ARCHITECTURE
# =============================================================================
permissions:
  # 3.1 Scope - What you can touch
  scope:
    in_scope:
{%for path in in_scope_paths%}
      - "${path}"
{%endfor%}

    out_of_scope:
{%for path in out_of_scope_paths%}
      - "${path}"
{%endfor%}

  # 3.2 Autonomy Levels
  autonomy:
    # AUTONOMOUS - Proceed without asking
    autonomous:
      - "File creation/deletion within scope"
      - "Dependency installation"
      - "Running tests"
      - "Refactoring for consistency"
{%for action in autonomous_actions%}
      - "${action}"
{%endfor%}

    # CONFIRM FIRST - Ask before proceeding
    confirm_first:
      - "Architectural changes affecting >3 modules"
      - "Breaking API changes"
      - "Deletions of >100 lines"
{%for action in confirm_first_actions%}
      - "${action}"
{%endfor%}

    # PROHIBITED - Do not attempt
    prohibited:
      - "Commits to main branch"
      - "External API calls with side effects"
      - "Modifications outside scope"
{%for action in prohibited_actions%}
      - "${action}"
{%endfor%}

  # 3.3 Resource Budget
  resource_budget:
    max_iterations: ${max_iterations:5}
    max_files_per_pass: ${max_files_per_pass:20}
    exploration_timeout_minutes: ${exploration_timeout_minutes:10}

# =============================================================================
# SECTION 4: FEEDBACK LOOP SPECIFICATION
# =============================================================================
feedback:
  # 4.1 Verification Commands - Run in this order
  verification_commands:
    - name: "lint"
      command: "${lint_command:ruff check .}"
      timeout_seconds: 120
      fail_fast: false

    - name: "type_check"
      command: "${type_check_command:mypy src/}"
      timeout_seconds: 180
      fail_fast: false

    - name: "unit_tests"
      command: "${test_command:pytest tests/unit -v}"
      timeout_seconds: 300
      fail_fast: false

    - name: "integration_tests"
      command: "${integration_test_command:pytest tests/integration -v}"
      timeout_seconds: 600
      fail_fast: false

{%for cmd in verification_commands%}
    - name: "${cmd.name}"
      command: "${cmd.command}"
      timeout_seconds: ${cmd.timeout:300}
      fail_fast: ${cmd.fail_fast:false}
{%endfor%}

  # 4.2 Error Handling Protocol
  error_handling:
    on_lint_failure:
      action: "auto_fix"
      then: "re-run"

    on_type_error:
      action: "analyze_error"
      then: "fix_types"
      finally: "re-run"

    on_test_failure:
      action: "read_failure_output"
      then: "identify_root_cause"
      next: "fix_implementation"
      finally: "re-run"

    on_repeated_failure:
      threshold: 3
      action: "stop_and_report"
      request: "human_guidance"

  # 4.3 Success Verification
  success_verification:
    - check: "All verification commands pass"
      required: true

    - check: "Manual smoke test"
      command: "${smoke_test_command:}"
      required: ${smoke_test_required:false}

    - check: "Generate change summary"
      required: true

# =============================================================================
# SECTION 5: CONTEXT PERSISTENCE
# =============================================================================
session:
  # 5.1 Session Memory File
  memory_file: "${memory_file:CLAUDE.md}"

  # 5.2 Sections to maintain
  sections:
    - name: "Build Commands"
      format: "markdown_table"
      persist: true

    - name: "Test Commands"
      format: "markdown_table"
      persist: true

    - name: "Architecture Decisions"
      format: "markdown_table"
      columns: ["date", "decision", "rationale"]
      persist: true

    - name: "Known Issues"
      format: "markdown_list"
      persist: true

  # 5.3 Information to preserve
  preserve_info:
    - "Build/test commands that work"
    - "Non-obvious environment setup steps"
    - "Architectural decisions and their rationale"
    - "Gotchas discovered during implementation"

  # 5.4 Information that can be re-derived
  derivable_info:
    - "File structure (can be scanned)"
    - "Dependency versions (in lockfile)"
    - "Current test status (can re-run)"

# =============================================================================
# SECTION 6: EXECUTION PROTOCOL
# =============================================================================
execution:
  # 6.1 Initial Actions - Always do first
  initial_actions:
    - action: "read_session_memory"
      command: "cat ${memory_file:CLAUDE.md}"
      required: false

    - action: "scan_project_structure"
      command: "${scan_command:find . -type f -name '*.py' | head -50}"
      required: true

    - action: "identify_entry_points"
      required: true

    - action: "run_existing_tests"
      command: "${test_command:pytest tests/ -v}"
      required: false

  # 6.2 Implementation Order
  implementation_order:
    - phase: "understand"
      description: "Read existing patterns before writing"
      agent: "planning"

    - phase: "implement"
      description: "Write smallest working version"
      agent: "implementation"

    - phase: "error_handling"
      description: "Add error handling"
      agent: "implementation"

    - phase: "test"
      description: "Write tests"
      agent: "testing"

    - phase: "verify"
      description: "Run verification loop"
      agent: "verification"

    - phase: "refactor"
      description: "Refactor if needed"
      agent: "implementation"

    - phase: "document"
      description: "Update session memory"
      agent: "documentation"

  # 6.3 Completion Checklist
  completion_checklist:
    - item: "All success criteria met"
      verification: "check_success_criteria"

    - item: "All verification commands pass"
      verification: "run_all_verifications"

    - item: "Session memory updated"
      verification: "check_memory_updated"

    - item: "Summary of changes provided"
      verification: "generate_summary"

    - item: "Known limitations documented"
      verification: "check_limitations_documented"

# =============================================================================
# SECTION 7: SUB-AGENT CONFIGURATION
# =============================================================================
sub_agents:
  # Configure which sub-agents to use for different task types
  explore:
    enabled: true
    use_for:
      - "Finding files by pattern"
      - "Searching code for keywords"
      - "Understanding codebase structure"
    thoroughness: "${explore_thoroughness:medium}"

  plan:
    enabled: true
    use_for:
      - "Designing implementation strategies"
      - "Identifying critical files"
      - "Considering architectural trade-offs"

  bash:
    enabled: true
    use_for:
      - "Git operations"
      - "Running commands"
      - "Terminal tasks"

  general_purpose:
    enabled: true
    use_for:
      - "Complex multi-step tasks"
      - "Research requiring multiple rounds"

{%for agent in sub_agents%}
  ${agent.name}:
    enabled: ${agent.enabled:true}
    model: "${agent.model:}"
    timeout_seconds: ${agent.timeout:300}
    use_for:
{%for use_case in agent.use_cases%}
      - "${use_case}"
{%endfor%}
{%endfor%}

# =============================================================================
# METADATA
# =============================================================================
metadata:
  template_version: "1.0.0"
  created_at: "${generated_at}"
  project_name: "${project_name}"
  author: "${author:}"
  tags:
{%for tag in tags%}
    - "${tag}"
{%endfor%}
